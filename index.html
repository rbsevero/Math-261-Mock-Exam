const TITLE="Math 261: Survival and Loss Models";
const MODS=[["Basic Probability",["Functions and Moments","Percentiles","Conditional Probability and Expectation","Moment and Probability Generating Functions","The Empirical Distribution"]],
["Parametric Distributions",["Scaling and Transformations","Common Parametric Distributions","The Linear Exponential Family","Limiting Distributions"]],
["Variance & Approximations",["Additivity","Normal Approximation","Bernoulli Shortcut"]],
["Mixtures, Splices & Frailty Models",["Discrete and Continuous Mixtures","Frailty Models","Conditional Variance","Splices"]],
["Severity Coverage Modifications",["Policy Limits","Deductibles","Loss Elimination Ratio (LER)","Other Coverage Modifications & Bonuses"]],
["Risk Measures and Tail Weight",["Coherent Risk Measures","Value-at-Risk (VaR)","Tail-Value-at-Risk (TVaR)","Tail Weight","Extreme Value Distributions"]],
["Frequency Distributions",["The (a, b, 0) Class","The (a, b, 1) Class","Poisson/Gamma Models","Exposure & Coverage Modifications"]],
["Aggregate Loss Models",["Compound Variance","Approximating Distributions","Severity Modifications","The Recursive Formula","Aggregate Deductibles","Miscellaneous Topics"]]];
const LN=l=>{const[m,k]=l.split('.');return l+' '+MODS[m-1][1][k-1]};
let _n=0;const Q=(l,q,c,a,s)=>({id:'s'+(++_n),m:+l.split('.')[0],d:'e',l,q,c,a,s});
const SEED=[
Q("1.1",r`The density of $X$ is $f(x)=\frac{3x^2}{1000}$ for $0<x<10$. Calculate $E[X]$.`,["5.00","6.67","7.00","7.50"],3,r`$E[X]=\int_0^{10}x\cdot\frac{3x^2}{1000}\,dx=\frac{3}{1000}\cdot\frac{10^4}{4}=7.5$.`),
Q("1.2",r`Loss $X$ has CDF $F(x)=1-\left(\frac{100}{100+x}\right)^2$ for $x>0$. Calculate the 70th percentile.`,["54.8","70.0","82.6","100.0"],2,r`Set $F(x)=0.7$, so $\left(\frac{100}{100+x}\right)^2=0.3$.
Then $100+x=100/\sqrt{0.3}=182.57$, so $x=82.6$.`),
Q("2.2",r`$X$ follows a Pareto distribution with $\alpha=3$ and $\theta=2000$. Calculate $\operatorname{Var}(X)$.`,[r`$1\times10^6$`,r`$3\times10^6$`,r`$4\times10^6$`,r`$6\times10^6$`],1,r`$E[X]=\frac{\theta}{\alpha-1}=1000$ and $E[X^2]=\frac{2\theta^2}{(\alpha-1)(\alpha-2)}=4\times10^6$.
So $\operatorname{Var}(X)=4\times10^6-10^6=3\times10^6$.`),
Q("2.1",r`Losses $X$ are exponential with mean 500. Inflation of 5% turns each loss into $Y=1.05X$. Calculate $P(Y>600)$.`,["0.2837","0.3012","0.3189","0.3500"],2,r`$Y$ is exponential with $\theta=1.05(500)=525$ (scale family).
$P(Y>600)=e^{-600/525}=e^{-1.1429}=0.3189$.`),
Q("3.2",r`A portfolio has 100 independent policies, each with mean loss 50 and standard deviation 20. Use the normal approximation to estimate $P(S>5300)$ for the total $S$.`,["0.0013","0.0228","0.0668","0.1587"],2,r`$E[S]=5000$, $\operatorname{Var}(S)=100(400)=40000$, so $\sigma_S=200$.
$z=\frac{5300-5000}{200}=1.5$, so $P=1-\Phi(1.5)=0.0668$.`),
Q("3.3",r`A loss equals 1000 with probability 0.2 and 400 with probability 0.8. Calculate its variance.`,["28,800","57,600","90,000","360,000"],1,r`Bernoulli shortcut: $\operatorname{Var}=(a-b)^2pq=600^2(0.2)(0.8)=57{,}600$.`),
Q("4.1",r`With probability 0.6, $X$ is exponential with mean 100; with probability 0.4, it is exponential with mean 500. Calculate $\operatorname{Var}(X)$.`,["100,000","125,800","144,400","212,000"],2,r`$E[X]=0.6(100)+0.4(500)=260$.
$E[X^2]=0.6(2)(100^2)+0.4(2)(500^2)=212{,}000$.
$\operatorname{Var}=212{,}000-260^2=144{,}400$.`),
Q("4.3",r`Given $\Theta$, $X$ has mean $\Theta$ and variance $2\Theta$. $\Theta$ has mean 10 and variance 3. Calculate $\operatorname{Var}(X)$.`,["13","20","23","26"],2,r`$\operatorname{Var}(X)=E[\operatorname{Var}(X|\Theta)]+\operatorname{Var}(E[X|\Theta])=E[2\Theta]+\operatorname{Var}(\Theta)=20+3=23$.`),
Q("5.1",r`$X$ is exponential with mean 1000. Calculate $E[X\wedge500]$.`,["367.9","393.5","500.0","606.5"],1,r`$E[X\wedge u]=\theta(1-e^{-u/\theta})=1000(1-e^{-0.5})=393.5$.`),
Q("5.2",r`Losses are exponential with mean 1000. A policy has an ordinary deductible of 500. Calculate the expected payment per loss.`,["393.5","500.0","606.5","1,000.0"],2,r`$E[(X-d)_+]=E[X]-E[X\wedge d]=1000-393.5=606.5$.
This equals $\theta e^{-d/\theta}=1000e^{-0.5}$.`),
Q("5.3",r`Losses are Pareto with $\alpha=3$ and $\theta=2000$. Find the loss elimination ratio for an ordinary deductible of 1000.`,["0.3333","0.4444","0.5556","0.6667"],2,r`$E[X\wedge1000]=\frac{\theta}{\alpha-1}\left[1-\left(\frac{\theta}{\theta+d}\right)^{\alpha-1}\right]=1000\left(1-\frac49\right)=555.6$.
$\text{LER}=555.6/1000=0.5556$.`),
Q("6.2",r`Losses are exponential with mean 1000. Calculate $\text{VaR}_{0.95}$.`,["1,609","2,303","2,996","3,912"],2,r`$\text{VaR}_{0.95}=-\theta\ln(0.05)=1000\ln20=2996$.`),
Q("6.3",r`Losses are exponential with mean 1000. Calculate $\text{TVaR}_{0.95}$.`,["2,996","3,303","3,996","4,605"],2,r`By memorylessness, $\text{TVaR}_p=\text{VaR}_p+\theta=2996+1000=3996$.`),
Q("7.1",r`$N$ is negative binomial with $r=2$ and $\beta=1$. Calculate $P(N=2)$.`,["0.1250","0.1500","0.1875","0.2500"],2,r`$a=\frac{\beta}{1+\beta}=0.5$, $b=(r-1)a=0.5$, $p_0=(1+\beta)^{-r}=0.25$.
$p_1=p_0(a+b)=0.25$ and $p_2=p_1(a+b/2)=0.25(0.75)=0.1875$.`),
Q("7.2",r`$N^T$ is a zero-truncated Poisson with $\lambda=1$. Calculate $P(N^T=1)$.`,["0.3679","0.5820","0.6321","0.7358"],1,r`$p_1^T=\frac{p_1}{1-p_0}=\frac{e^{-1}}{1-e^{-1}}=\frac{0.3679}{0.6321}=0.5820$.`),
Q("8.1",r`Claim count $N$ is Poisson with mean 3. Severity has mean 100 and variance 5000. Calculate $\operatorname{Var}(S)$.`,["15,000","30,000","45,000","90,000"],2,r`For compound Poisson, $\operatorname{Var}(S)=\lambda E[X^2]=3(5000+100^2)=45{,}000$.`),
Q("8.4",r`$N$ is Poisson with $\lambda=1$. Severity is 1 or 2 with probability 0.5 each. Using the recursive formula, calculate $g_2=P(S=2)$.`,["0.1380","0.1839","0.2299","0.3679"],2,r`$g_0=e^{-1}=0.3679$, and $g_k=\frac{\lambda}{k}\sum_j jf_jg_{k-j}$.
$g_1=0.5g_0=0.1839$.
$g_2=\frac12[1(0.5)g_1+2(0.5)g_0]=\frac12(0.0920+0.3679)=0.2299$.`),
Q("8.5",r`$S$ equals 0, 100 or 200 with probabilities 0.5, 0.3, 0.2. Calculate $E[(S-150)_+]$.`,["5","10","15","20"],1,r`Only $S=200$ exceeds 150, so $E[(S-150)_+]=0.2(50)=10$.`)];

const EMB=[{"id":"b1-1","m":1,"d":"e","l":"1.1","q":"$X$ is uniform on $[0,40]$ with hazard rate function $h(x)$. Calculate $h(30)$.","c":["0.025","0.033","0.100","0.750"],"a":2,"s":"For $0<x<40$, $f(x)=\\frac1{40}$ and $S(x)=\\frac{40-x}{40}$.\n$h(x)=\\frac{f(x)}{S(x)}=\\frac{1}{40-x}$, so $h(30)=\\frac1{10}=0.100$."},{"id":"b1-2","m":1,"d":"e","l":"1.1","q":"For a random variable $X$: $E[X]=5$, $\\operatorname{Var}(X)=4$ and $E[X^3]=200$. Calculate the skewness of $X$.","c":["0.94","1.50","1.88","2.50"],"a":2,"s":"Third central moment: $E[X^3]-3\\mu\\sigma^2-\\mu^3=200-3(5)(4)-125=15$.\nSkewness $=\\frac{15}{\\sigma^3}=\\frac{15}{8}=1.875$."},{"id":"b1-3","m":1,"d":"e","l":"1.1","q":"$X$ has a gamma distribution with $\\alpha=3$ and $\\theta=250$. Calculate the kurtosis of $X$.","c":["4","5","6","9"],"a":1,"s":"The kurtosis of a gamma depends only on $\\alpha$: $3+\\frac{6}{\\alpha}=3+2=5$."},{"id":"b1-4","m":1,"d":"e","l":"1.1","q":"A gamma distribution has coefficient of variation $0.5$. Calculate its skewness.","c":["0.5","1","2","4"],"a":1,"s":"$CV=\\frac{1}{\\sqrt\\alpha}=0.5$, so $\\alpha=4$.\nSkewness of a gamma is $\\frac{2}{\\sqrt\\alpha}=\\frac22=1$."},{"id":"b1-5","m":1,"d":"e","l":"1.1","q":"The joint distribution of $(X,Y)$ is $P(0,0)=0.30$, $P(0,1)=0.10$, $P(1,0)=0.10$, $P(1,1)=0.30$ and $P(2,1)=0.20$. Calculate the correlation of $X$ and $Y$.","c":["0.16","0.30","0.46","0.60"],"a":3,"s":"$E[X]=0.80$, $E[Y]=0.60$, $E[XY]=0.70$.\n$\\operatorname{Var}(X)=0.56$, $\\operatorname{Var}(Y)=0.24$, $\\operatorname{Cov}=0.22$.\n$\\rho=\\frac{0.22}{\\sqrt{(0.56)(0.24)}}=0.6001$."},{"id":"b1-6","m":1,"d":"e","l":"1.1","q":"$X$ has density $f(x)=\\frac{6x}{(1+x^2)^4}$ for $x>0$. Find the mode of $X$.","c":["0.250","0.378","0.500","0.707"],"a":1,"s":"Set $f'(x)=0$: $(1+x^2)^{-4}-8x^2(1+x^2)^{-5}=0$, so $1+x^2=8x^2$.\n$x^2=\\frac17$ and $x=0.378$."},{"id":"b1-7","m":1,"d":"e","l":"1.2","q":"$X$ takes the values 1, 3, 6, 10 with probabilities 0.25, 0.35, 0.15, 0.25. Which set contains exactly the 60th percentiles of $X$?","c":["$\\{3\\}$","$[3,6]$","$[3,6)$","$\\{6\\}$"],"a":1,"s":"$F(3)=0.60$ and $F(x)=0.60$ for $3\\le x<6$, and $F(6)=0.75$.\nA 60th percentile $x$ satisfies $\\Pr(X<x)\\le0.6$ and $\\Pr(X\\le x)\\ge0.6$. This holds for every $x$ from 3 up to and including 6, because $\\Pr(X<6)=0.60$."},{"id":"b1-8","m":1,"d":"e","l":"1.2","q":"$X$ is Weibull with $\\tau=2$ and $\\theta=100$. Calculate the median of $X$.","c":["69.3","83.3","100.0","120.2"],"a":1,"s":"$S(x)=e^{-(x/\\theta)^\\tau}=0.5$, so $(x/100)^2=\\ln2$.\n$x=100\\sqrt{\\ln2}=83.3$."},{"id":"b1-9","m":1,"d":"e","l":"1.3","q":"70% of drivers are good and 30% are bad. In a year, a good driver has a claim with probability 0.10 and a bad driver with probability 0.40. A randomly selected driver has a claim. Calculate the probability that the driver is bad.","c":["0.30","0.40","0.63","0.70"],"a":2,"s":"Bayes: $\\Pr(\\text{bad}|\\text{claim})=\\frac{0.3(0.4)}{0.7(0.1)+0.3(0.4)}=\\frac{0.12}{0.19}=0.632$."},{"id":"b1-10","m":1,"d":"e","l":"1.3","q":"Let $Y$ be a risk class with $\\Pr(Y=1)=0.6$ and $\\Pr(Y=2)=0.4$. Claim size $X$ has $E[X|Y=1]=2000$ and $E[X|Y=2]=5000$. Calculate $E[X]$.","c":["3,200","3,500","3,800","4,000"],"a":0,"s":"$E[X]=E[E[X|Y]]=0.6(2000)+0.4(5000)=1200+2000=3200$.$E[X]=E\\big[E[X|Y]\\big]=0.6(2000)+0.4(5000)=3200$."},{"id":"b1-11","m":1,"d":"e","l":"1.4","q":"$N$ has probability generating function $P(z)=e^{2(z-1)}$. Calculate $\\operatorname{Var}(N)$.","c":["1","2","4","6"],"a":1,"s":"$P'(1)=E[N]=2$ and $P''(1)=E[N(N-1)]=4$.\n$\\operatorname{Var}(N)=P''(1)+P'(1)-P'(1)^2=4+2-4=2$."},{"id":"b1-12","m":1,"d":"e","l":"1.4","q":"$X$ has moment generating function $M(t)=(1-100t)^{-3}$. Calculate $E[X^2]$.","c":["30,000","90,000","120,000","300,000"],"a":2,"s":"This is a gamma MGF with $\\alpha=3$, $\\theta=100$.\n$E[X^2]=\\alpha(\\alpha+1)\\theta^2=3(4)(10^4)=120{,}000$."},{"id":"b1-13","m":1,"d":"e","l":"1.5","q":"A sample is $2,4,4,6,9$. Calculate the variance of the empirical distribution of this sample.","c":["4.0","5.6","7.0","28.0"],"a":1,"s":"Each point has probability $\\frac15$, and the mean is $5$.\n$\\operatorname{Var}=\\frac{(-3)^2+(-1)^2+(-1)^2+1^2+4^2}{5}=\\frac{28}{5}=5.6$. (Dividing by $n-1$ gives the sample variance 7, not the empirical variance.)"},{"id":"b1-14","m":1,"d":"e","l":"1.5","q":"The empirical distribution puts probability $\\frac14$ on each of the pairs $(1,3)$, $(2,1)$, $(4,5)$ and $(6,7)$. Calculate its covariance.","c":["2.75","3.25","3.75","4.25"],"a":2,"s":"$\\bar x=3.25$, $\\bar y=4$, and $E[XY]=\\frac{3+2+20+42}{4}=16.75$.\n$\\operatorname{Cov}=16.75-3.25(4)=3.75$."},{"id":"b2-1","m":2,"d":"e","l":"2.1","q":"Losses $X$ are Pareto with $\\alpha=3$ and $\\theta=1000$. Inflation of 20% turns each loss into $Y=1.2X$. Calculate $P(Y>2000)$.","c":["0.0370","0.0527","0.0870","0.1250"],"a":1,"s":"$Y$ is Pareto with the same $\\alpha=3$ and $\\theta=1.2(1000)=1200$ (scale family).\n$P(Y>2000)=\\left(\\frac{1200}{1200+2000}\\right)^3=0.375^3=0.0527$."},{"id":"b2-2","m":2,"d":"e","l":"2.1","q":"$X$ is exponential with mean 200, and $Y=\\sqrt{X}$. Calculate $P(Y>10)$.","c":["0.3679","0.3935","0.6065","0.7788"],"a":2,"s":"$Y>10$ exactly when $X>100$. So $P(Y>10)=e^{-100/200}=e^{-0.5}=0.6065$.\n($Y$ is Weibull with $\\tau=2$ and $\\theta=\\sqrt{200}$.)"},{"id":"b2-3","m":2,"d":"e","l":"2.1","q":"$X$ is exponential with mean 0.5, and $Y=e^X$. Calculate $E[Y]$.","c":["1.5","2","3","4"],"a":1,"s":"$Y$ is single-parameter Pareto with $\\theta=1$ and $\\alpha=\\frac{1}{0.5}=2$.\n$E[Y]=\\frac{\\alpha\\theta}{\\alpha-1}=\\frac{2}{1}=2$. Directly: $E[e^X]=M_X(1)=\\frac{1}{1-0.5}=2$."},{"id":"b2-4","m":2,"d":"e","l":"2.1","q":"$X$ is lognormal with $\\mu=7$ and $\\sigma=0.8$. Inflation of 10% turns each loss into $Y=1.1X$. Calculate $E[Y]$.","c":["1,510","1,661","1,820","2,100"],"a":1,"s":"$E[X]=e^{\\mu+\\sigma^2/2}=e^{7.32}=1510.2$, and $E[Y]=1.1E[X]=1661$.\nEquivalently, $Y$ is lognormal with $\\mu=7+\\ln1.1$ and the same $\\sigma$."},{"id":"b2-5","m":2,"d":"e","l":"2.2","q":"$X$ is uniform on $[0,1000]$. Calculate $\\operatorname{Var}(X)$.","c":["83,333","250,000","333,333","1,000,000"],"a":0,"s":"$\\operatorname{Var}(X)=\\frac{(b-a)^2}{12}=\\frac{1000^2}{12}=83{,}333$."},{"id":"b2-6","m":2,"d":"e","l":"2.2","q":"$X$ has a beta distribution with $a=2$, $b=3$ and $\\theta=100$ (support $0<x<100$). Calculate $\\operatorname{Var}(X)$.","c":["240","400","600","2,400"],"a":1,"s":"With $Z=X/100$ beta$(2,3)$: $\\operatorname{Var}(Z)=\\frac{ab}{(a+b)^2(a+b+1)}=\\frac{6}{25(6)}=0.04$.\n$\\operatorname{Var}(X)=100^2(0.04)=400$."},{"id":"b2-7","m":2,"d":"e","l":"2.2","q":"Losses are exponential with mean 500. Given that a loss exceeds 300, calculate the probability that it exceeds 800.","c":["0.2019","0.3679","0.5488","0.6065"],"a":1,"s":"By memorylessness, $P(X>800|X>300)=P(X>500)=e^{-500/500}=e^{-1}=0.3679$."},{"id":"b2-8","m":2,"d":"e","l":"2.2","q":"$X$ is gamma with $\\alpha=3$ and $\\theta=50$. Calculate $P(X\\le100)$.","c":["0.2707","0.3233","0.4060","0.5940"],"a":1,"s":"For integer $\\alpha$, with $\\lambda=x/\\theta=2$: $P(X\\le x)=1-e^{-\\lambda}\\sum_{k=0}^{\\alpha-1}\\frac{\\lambda^k}{k!}$.\n$=1-e^{-2}\\left(1+2+2\\right)=1-5(0.13534)=0.3233$."},{"id":"b2-9","m":2,"d":"e","l":"2.2","q":"$X$ is Weibull with $\\tau=2$ and $\\theta=100$. Calculate $E[X]$.","c":["50.0","88.6","100.0","141.4"],"a":1,"s":"$E[X]=\\theta\\,\\Gamma\\left(1+\\frac1\\tau\\right)=100\\,\\Gamma(1.5)=100(0.8862)=88.6$."},{"id":"b2-10","m":2,"d":"e","l":"2.2","q":"Losses are Pareto with $\\alpha=4$ and $\\theta=3000$. Calculate the mean excess loss $e(1000)=E[X-1000|X>1000]$.","c":["1,000.0","1,333.3","1,666.7","2,000.0"],"a":1,"s":"For a Pareto, $e(d)=\\frac{\\theta+d}{\\alpha-1}=\\frac{4000}{3}=1333.3$."},{"id":"b2-11","m":2,"d":"e","l":"2.2","q":"$X$ is single-parameter Pareto with $\\alpha=2.5$ and $\\theta=400$. Calculate $E[X\\wedge1000]$.","c":["400.0","599.2","666.7","733.3"],"a":1,"s":"$E[X\\wedge d]=\\frac{\\alpha\\theta}{\\alpha-1}-\\frac{\\theta^\\alpha}{(\\alpha-1)d^{\\alpha-1}}$ for $d\\ge\\theta$.\n$=\\frac{2.5(400)}{1.5}-\\frac{400^{2.5}}{1.5(1000^{1.5})}=666.67-67.47=599.2$. (The first term is $E[X]$.)"},{"id":"b2-12","m":2,"d":"e","l":"2.2","q":"$X$ is lognormal with $\\mu=5$ and $\\sigma=0.6$. Calculate $P(X>200)$.","c":["0.2420","0.3095","0.4005","0.6905"],"a":1,"s":"$z=\\frac{\\ln200-5}{0.6}=\\frac{0.2983}{0.6}=0.497$.\n$P(X>200)=1-\\Phi(0.497)=0.3095$."},{"id":"b2-13","m":2,"d":"e","l":"2.3","q":"$N$ is negative binomial with known $r=4$ and unknown mean $\\mu=2$, a member of the linear exponential family. Calculate $\\operatorname{Var}(N)$.","c":["2.0","3.0","4.0","6.0"],"a":1,"s":"$\\mu=r\\beta=2$, so $\\beta=0.5$.\n$\\operatorname{Var}(N)=r\\beta(1+\\beta)=4(0.5)(1.5)=3$. In terms of the mean, $v(\\mu)=\\mu\\left(1+\\frac{\\mu}{r}\\right)$."},{"id":"b2-14","m":2,"d":"e","l":"2.3","q":"$X$ is gamma with known $\\alpha=5$ and mean $\\mu=100$. Calculate $\\operatorname{Var}(X)$.","c":["500","2,000","10,000","50,000"],"a":1,"s":"$\\theta=\\frac{\\mu}{\\alpha}=20$, and $\\operatorname{Var}(X)=\\alpha\\theta^2=5(400)=2000$.\nIn terms of the mean, the variance function is $v(\\mu)=\\frac{\\mu^2}{\\alpha}$."},{"id":"b2-15","m":2,"d":"e","l":"2.4","q":"$X$ is Pareto with $\\alpha=1000$ and $\\theta=500{,}000$. Use the limiting exponential distribution to approximate $P(X>1000)$.","c":["0.0183","0.1353","0.3679","0.6065"],"a":1,"s":"As $\\alpha\\to\\infty$ with $\\theta/\\alpha$ fixed, a Pareto approaches an exponential with mean $\\frac{\\theta}{\\alpha}=500$.\n$P(X>1000)\\approx e^{-1000/500}=e^{-2}=0.1353$. (The exact Pareto value is about 0.1355.)"},{"id":"b2-16","m":2,"d":"e","l":"2.4","q":"A gamma distribution with $\\alpha\\to\\infty$, once standardized, approaches which distribution?","c":["Normal","Exponential","Lognormal","Pareto"],"a":0,"s":"For integer $\\alpha$ a gamma is a sum of $\\alpha$ independent exponentials. By the central limit theorem, the standardized sum approaches the standard normal."},{"id":"b3-1","m":3,"d":"e","l":"3.1","q":"$X_1$, $X_2$, $X_3$ are independent with variances 4, 9 and 16. Calculate $\\operatorname{Var}(2X_1-X_2+3X_3)$.","c":["47","109","169","241"],"a":2,"s":"For independent variables, coefficients are squared and signs do not matter.\n$\\operatorname{Var}=2^2(4)+(-1)^2(9)+3^2(16)=16+9+144=169$."},{"id":"b3-2","m":3,"d":"e","l":"3.1","q":"$X$ and $Y$ have standard deviations 3 and 4 and correlation $0.5$. Calculate $\\operatorname{Var}(X+Y)$.","c":["25","31","37","49"],"a":2,"s":"$\\operatorname{Var}(X+Y)=\\sigma_X^2+\\sigma_Y^2+2\\rho\\sigma_X\\sigma_Y=9+16+2(0.5)(12)=37$."},{"id":"b3-3","m":3,"d":"e","l":"3.1","q":"25 independent, identically distributed claims each have mean 80 and standard deviation 30. Calculate the variance of their sample average.","c":["6","36","144","900"],"a":1,"s":"$\\operatorname{Var}(\\bar X)=\\frac{\\sigma^2}{n}=\\frac{900}{25}=36$. (The standard deviation of the average is 6.)"},{"id":"b3-4","m":3,"d":"e","l":"3.1","q":"$X$ has variance 5. Let $S$ be the sum of 10 independent copies of $X$, and let $T=10X$. Calculate $\\operatorname{Var}(T)-\\operatorname{Var}(S)$.","c":["45","90","450","550"],"a":2,"s":"$\\operatorname{Var}(S)=10(5)=50$, since independent variances add.\n$\\operatorname{Var}(T)=10^2(5)=500$, since one variable is scaled.\nDifference: $500-50=450$."},{"id":"b3-5","m":3,"d":"e","l":"3.2","q":"A portfolio has 400 independent policies. Each has mean loss 25 and variance 100. Use the normal approximation to estimate the probability that total losses $S$ are between 9,700 and 10,500.","c":["0.8664","0.9270","0.9332","0.9938"],"a":1,"s":"$E[S]=10{,}000$, $\\operatorname{Var}(S)=40{,}000$, so $\\sigma_S=200$.\n$P(9700<S<10500)=\\Phi(2.5)-\\Phi(-1.5)=0.9938-0.0668=0.9270$."},{"id":"b3-6","m":3,"d":"e","l":"3.2","q":"$N$ is binomial with $n=100$ and $p=0.3$. Use the normal approximation with continuity correction to estimate $P(N\\ge35)$.","c":["0.1377","0.1631","0.2023","0.2420"],"a":1,"s":"$E[N]=30$ and $\\operatorname{Var}(N)=100(0.3)(0.7)=21$, so $\\sigma=4.583$.\n$N$ is an integer, so $P(N\\ge35)=P(N>34.5)$ after the correction.\n$z=\\frac{34.5-30}{4.583}=0.982$ and $P=1-\\Phi(0.982)=0.163$. (Without the correction, $z=1.09$ gives 0.138.)"},{"id":"b3-7","m":3,"d":"e","l":"3.2","q":"100 independent policies each have mean loss 50 and standard deviation 20. Using the normal approximation, find the total premium that makes the probability of total losses exceeding it equal to 5%.","c":["5,258","5,329","5,392","5,500"],"a":1,"s":"$E[S]=5000$, $\\sigma_S=20\\sqrt{100}=200$.\nThe 95th percentile of the standard normal is 1.645, so the premium is $5000+1.645(200)=5329$."},{"id":"b3-8","m":3,"d":"e","l":"3.2","q":"50 independent losses are each exponential with mean 100. Use the normal approximation to estimate the probability that their total exceeds 6000.","c":["0.0228","0.0787","0.1587","0.2420"],"a":1,"s":"$E[S]=5000$ and $\\operatorname{Var}(S)=50(100^2)=500{,}000$, so $\\sigma_S=707.1$.\n$z=\\frac{1000}{707.1}=1.414$ and $P=1-\\Phi(1.414)=0.0787$."},{"id":"b3-9","m":3,"d":"e","l":"3.3","q":"A loss is 5000 with probability 0.1 and 0 otherwise. Calculate its variance.","c":["250,000","2,250,000","2,500,000","25,000,000"],"a":1,"s":"Bernoulli shortcut: $\\operatorname{Var}=(5000-0)^2(0.1)(0.9)=2{,}250{,}000$."},{"id":"b3-10","m":3,"d":"e","l":"3.3","q":"A policy pays 100 with probability 0.25 and 40 with probability 0.75. Calculate the variance of the payment.","c":["450","675","900","1,350"],"a":1,"s":"The variance depends only on the gap: $\\operatorname{Var}=(100-40)^2(0.25)(0.75)=3600(0.1875)=675$."},{"id":"b3-11","m":3,"d":"e","l":"3.3","q":"20 independent policies each pay 10,000 with probability 0.05 and 0 otherwise. Calculate the standard deviation of total payments.","c":["2,179","9,747","21,794","97,468"],"a":1,"s":"One policy: $\\operatorname{Var}=10{,}000^2(0.05)(0.95)=4.75\\times10^6$.\nTwenty independent policies: $\\operatorname{Var}(S)=9.5\\times10^7$, so $\\sigma_S=9747$."},{"id":"b3-12","m":3,"d":"e","l":"3.3","q":"$X$ equals 12 with probability 0.7 and 4 with probability 0.3. Calculate $\\operatorname{Var}(X)$.","c":["8.40","10.08","13.44","16.80"],"a":2,"s":"$\\operatorname{Var}(X)=(12-4)^2(0.7)(0.3)=64(0.21)=13.44$."},{"id":"b4-1","m":4,"d":"e","l":"4.1","q":"With probability 0.4, $X$ is exponential with mean 100; with probability 0.6, it is exponential with mean 400. Calculate $P(X>300)$.","c":["0.1353","0.2500","0.3033","0.4724"],"a":2,"s":"The survival function of a mixture is the mixture of survival functions.\n$S(300)=0.4e^{-3}+0.6e^{-0.75}=0.0199+0.2834=0.3033$."},{"id":"b4-2","m":4,"d":"e","l":"4.1","q":"With probability 0.4, $X$ is exponential with mean 100; with probability 0.6, it is exponential with mean 400. Calculate the hazard rate $h(300)$.","c":["0.0025","0.0030","0.0055","0.0100"],"a":1,"s":"$h=\\frac{f}{S}$, and both $f$ and $S$ are mixtures.\n$f(300)=0.4\\frac{e^{-3}}{100}+0.6\\frac{e^{-0.75}}{400}=0.000908$ and $S(300)=0.3033$, so $h(300)=0.00299$.\nThe mixture hazard is not the mixture of hazards: that would give $0.4(0.01)+0.6(0.0025)=0.0055$."},{"id":"b4-3","m":4,"d":"e","l":"4.1","q":"With probability 0.3, $X$ is gamma with $\\alpha=2$, $\\theta=100$; with probability 0.7, it is Pareto with $\\alpha=3$, $\\theta=1000$. Calculate $\\operatorname{Var}(X)$.","c":["168,100","549,900","718,000","880,000"],"a":1,"s":"$E[X]=0.3(200)+0.7(500)=410$.\nGamma: $E[X^2]=\\alpha(\\alpha+1)\\theta^2=60{,}000$. Pareto: $E[X^2]=\\frac{2\\theta^2}{(\\alpha-1)(\\alpha-2)}=1{,}000{,}000$.\nMixture $E[X^2]=0.3(60{,}000)+0.7(1{,}000{,}000)=718{,}000$, so $\\operatorname{Var}=718{,}000-410^2=549{,}900$."},{"id":"b4-4","m":4,"d":"e","l":"4.1","q":"Given $\\Lambda=\\lambda$, $X$ is exponential with mean $1/\\lambda$. $\\Lambda$ is gamma with $\\alpha=4$ and $\\theta=0.002$. Calculate $P(X>500)$.","c":["0.0156","0.0625","0.1250","0.2500"],"a":1,"s":"$S(x)=E[e^{-\\Lambda x}]=M_\\Lambda(-x)=(1+\\theta x)^{-\\alpha}$.\n$S(500)=(1+0.002(500))^{-4}=2^{-4}=0.0625$. (This is a Pareto with $\\alpha=4$ and $\\theta=500$.)"},{"id":"b4-5","m":4,"d":"e","l":"4.2","q":"Conditional on frailty $\\Lambda=\\lambda$, $S(x|\\lambda)=e^{-\\lambda H_0(x)}$ with $H_0(x)=0.1x$. $\\Lambda$ is gamma with $\\alpha=3$ and $\\theta=0.5$. Calculate $S(10)$.","c":["0.1250","0.2963","0.3679","0.5000"],"a":1,"s":"$S(x)=E[e^{-\\Lambda H_0(x)}]=M_\\Lambda(-H_0)=(1+\\theta H_0)^{-\\alpha}$.\n$H_0(10)=1$, so $S(10)=1.5^{-3}=0.2963$."},{"id":"b4-6","m":4,"d":"e","l":"4.2","q":"Conditional on frailty $\\Lambda=\\lambda$, $S(x|\\lambda)=e^{-\\lambda H_0(x)}$ with $H_0(x)=0.1x$. $\\Lambda$ is gamma with $\\alpha=3$ and $\\theta=0.5$. Calculate the unconditional hazard rate $h(10)$.","c":["0.050","0.100","0.150","0.300"],"a":1,"s":"$S(x)=(1+\\theta H_0)^{-\\alpha}$, so $h(x)=-\\frac{S'}{S}=\\frac{\\alpha\\theta h_0(x)}{1+\\theta H_0(x)}$.\nWith $h_0=0.1$: $h(10)=\\frac{3(0.5)(0.1)}{1.5}=0.100$."},{"id":"b4-7","m":4,"d":"e","l":"4.2","q":"Given $\\Lambda$, $S(x|\\Lambda)=e^{-\\Lambda x}$. $\\Lambda$ equals 0.5 or 2 with probability 0.5 each. Calculate $S(1)$.","c":["0.2865","0.3709","0.4466","0.6065"],"a":1,"s":"$S(1)=0.5e^{-0.5}+0.5e^{-2}=0.5(0.6065)+0.5(0.1353)=0.3709$. Using the mean frailty 1.25 would wrongly give $e^{-1.25}=0.2865$."},{"id":"b4-8","m":4,"d":"e","l":"4.3","q":"Given $\\Theta=\\theta$, $X$ is exponential with mean $\\theta$. $\\Theta$ is uniform on $[100,300]$. Calculate $\\operatorname{Var}(X)$.","c":["40,000","43,333","46,667","50,000"],"a":2,"s":"$\\operatorname{Var}(X)=E[\\operatorname{Var}(X|\\Theta)]+\\operatorname{Var}(E[X|\\Theta])=E[\\Theta^2]+\\operatorname{Var}(\\Theta)$.\n$\\operatorname{Var}(\\Theta)=\\frac{200^2}{12}=3333.3$, $E[\\Theta^2]=3333.3+200^2=43{,}333.3$.\n$\\operatorname{Var}(X)=43{,}333.3+3333.3=46{,}667$."},{"id":"b4-9","m":4,"d":"e","l":"4.3","q":"Given $\\Lambda$, $N$ is Poisson with mean $\\Lambda$. $\\Lambda$ is gamma with $\\alpha=3$ and $\\theta=2$. Calculate $\\operatorname{Var}(N)$.","c":["6","12","18","36"],"a":2,"s":"$E[\\Lambda]=\\alpha\\theta=6$ and $\\operatorname{Var}(\\Lambda)=\\alpha\\theta^2=12$.\n$\\operatorname{Var}(N)=E[\\Lambda]+\\operatorname{Var}(\\Lambda)=6+12=18$."},{"id":"b4-10","m":4,"d":"e","l":"4.3","q":"Class A (60% of insureds) has claim mean 10 and variance 4. Class B (40%) has claim mean 20 and variance 9. Calculate the variance of a randomly selected insured's claim.","c":["6","24","30","36"],"a":2,"s":"$E[\\operatorname{Var}]=0.6(4)+0.4(9)=6$.\n$E[X]=14$ and $\\operatorname{Var}(E[X|\\text{class}])=0.6(100)+0.4(400)-14^2=24$.\nTotal: $6+24=30$."},{"id":"b4-11","m":4,"d":"e","l":"4.3","q":"Given $\\Theta=\\theta$, $X$ is uniform on $[0,\\theta]$. $\\Theta$ is uniform on $[0,10]$. Calculate $\\operatorname{Var}(X)$.","c":["2.08","2.78","4.86","8.33"],"a":2,"s":"$E[\\operatorname{Var}(X|\\Theta)]=E\\left[\\frac{\\Theta^2}{12}\\right]=\\frac{100/3}{12}=2.778$.\n$\\operatorname{Var}(E[X|\\Theta])=\\operatorname{Var}\\left(\\frac\\Theta2\\right)=\\frac{100/12}{4}=2.083$.\nTotal: $4.861$."},{"id":"b4-12","m":4,"d":"e","l":"4.4","q":"A spliced density is $f(x)=\\frac{0.6}{1000}$ for $0<x<1000$ and $f(x)=0.4\\cdot\\frac{1}{500}e^{-(x-1000)/500}$ for $x>1000$. Calculate $P(X>1500)$.","c":["0.0541","0.1472","0.2207","0.3679"],"a":1,"s":"Only the second piece reaches beyond 1500, and it has total probability 0.4.\n$P(X>1500)=0.4e^{-500/500}=0.4(0.3679)=0.1472$."},{"id":"b4-13","m":4,"d":"e","l":"4.4","q":"A spliced density is $f(x)=\\frac{0.6}{1000}$ for $0<x<1000$ and $f(x)=0.4\\cdot\\frac{1}{500}e^{-(x-1000)/500}$ for $x>1000$. Calculate $E[X]$.","c":["600","750","900","1,100"],"a":2,"s":"First piece: uniform on $[0,1000]$ with weight 0.6, mean 500. Second piece: $1000+$ exponential with mean 500, so mean 1500, with weight 0.4.\n$E[X]=0.6(500)+0.4(1500)=900$."},{"id":"b4-14","m":4,"d":"e","l":"4.4","q":"A density is $f(x)=k$ for $0<x<10$ and $f(x)=k\\left(\\frac{10}{x}\\right)^3$ for $x>10$ (continuous at 10). Calculate $P(X>20)$.","c":["0.0417","0.0833","0.1250","0.3333"],"a":1,"s":"$\\int_0^{10}k\\,dx+k\\,10^3\\int_{10}^\\infty x^{-3}dx=10k+5k=15k=1$, so $k=\\frac1{15}$.\n$P(X>20)=k\\,10^3\\cdot\\frac{1}{2(20^2)}=\\frac{1.25}{15}=0.0833$."},{"id":"b4-15","m":4,"d":"e","l":"4.4","q":"A density is $f(x)=k$ for $0<x<10$ and $f(x)=k\\left(\\frac{10}{x}\\right)^3$ for $x>10$ (continuous at 10). Calculate $E[X]$.","c":["5","10","12.5","15"],"a":1,"s":"$E[X]=\\int_0^{10}kx\\,dx+k\\,10^3\\int_{10}^\\infty x^{-2}dx=50k+100k=150k=10$."},{"id":"b4-16","m":4,"d":"e","l":"4.4","q":"A loss distribution is spliced at 500. The part below 500 has weight 0.7 and follows an exponential distribution with mean 300 (truncated to $x<500$). Calculate the density at 200.","c":["0.00120","0.00148","0.00171","0.00211"],"a":1,"s":"The piece below 500 is the exponential density rescaled to total probability 0.7: $f(x)=0.7\\cdot\\frac{g(x)}{G(500)}$.\n$f(200)=0.7\\cdot\\frac{\\frac1{300}e^{-200/300}}{1-e^{-500/300}}=0.7\\cdot\\frac{0.001711}{0.8111}=0.00148$."},{"id":"b5-1","m":5,"d":"e","l":"5.1","q":"Losses are exponential with mean 2000. A policy has a limit of 3000. Calculate the expected payment per loss.","c":["1,500.0","1,553.7","1,800.0","2,000.0"],"a":1,"s":"$E[X\\wedge u]=\\theta(1-e^{-u/\\theta})=2000(1-e^{-1.5})=1553.7$."},{"id":"b5-2","m":5,"d":"e","l":"5.1","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. A policy has a limit of 5000. Calculate the expected payment per loss.","c":["816.3","918.4","1,000.0","1,081.6"],"a":1,"s":"$E[X\\wedge u]=\\frac{\\theta}{\\alpha-1}\\left[1-\\left(\\frac{\\theta}{\\theta+u}\\right)^{\\alpha-1}\\right]=1000\\left[1-\\left(\\frac27\\right)^2\\right]=918.4$."},{"id":"b5-3","m":5,"d":"e","l":"5.1","q":"Ground-up losses this year are exponential with mean 1000, and a policy has a limit of 2000. Next year losses will be 10% higher, with the limit unchanged. Calculate next year's expected payment per loss.","c":["864.7","921.5","951.2","1,100.0"],"a":1,"s":"Next year's losses $Y=1.1X$ are exponential with $\\theta=1100$.\n$E[Y\\wedge2000]=1100(1-e^{-2000/1100})=921.5$. (Simply inflating this year's 864.7 by 10% gives 951.2, which ignores the fixed limit.)"},{"id":"b5-4","m":5,"d":"e","l":"5.1","q":"Losses are Weibull with $\\tau=2$ and $\\theta=100$. A policy has a limit of 150. Calculate the probability that a loss results in a payment equal to the limit.","c":["0.0235","0.1054","0.2231","0.3679"],"a":1,"s":"The payment equals the limit exactly when $X>150$.\n$S(150)=e^{-(150/100)^2}=e^{-2.25}=0.1054$."},{"id":"b5-5","m":5,"d":"e","l":"5.1","q":"Losses are exponential with mean 100. A policy has a limit of 100. Calculate the variance of the payment per loss.","c":["1,289","3,996","5,285","10,000"],"a":0,"s":"$E[X\\wedge100]=100(1-e^{-1})=63.21$.\n$E[(X\\wedge u)^2]=2\\theta^2\\,\\Gamma(3;u/\\theta)+u^2e^{-u/\\theta}$, where $\\Gamma(3;1)=1-e^{-1}(1+1+\\tfrac12)=0.0803$.\n$=2(10^4)(0.0803)+10^4e^{-1}=1606+3679=5285$, so $\\operatorname{Var}=5285-63.21^2=1289$."},{"id":"b5-6","m":5,"d":"e","l":"5.2","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. A policy has an ordinary deductible of 500. Calculate the expected payment per loss.","c":["360","640","800","1,000"],"a":1,"s":"$E[(X-d)_+]=E[X]-E[X\\wedge d]=\\frac{\\theta}{\\alpha-1}\\left(\\frac{\\theta}{\\theta+d}\\right)^{\\alpha-1}=1000(0.8)^2=640$."},{"id":"b5-7","m":5,"d":"e","l":"5.2","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. A policy has an ordinary deductible of 500. Calculate the expected payment per payment.","c":["640","1,000","1,250","1,500"],"a":2,"s":"For a Pareto, $e(d)=\\frac{\\theta+d}{\\alpha-1}=\\frac{2500}{2}=1250$.\nCheck: payment per loss divided by $S(500)=0.512$ gives $640/0.512=1250$."},{"id":"b5-8","m":5,"d":"e","l":"5.2","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. A policy has a franchise deductible of 500. Calculate the expected payment per loss.","c":["640","896","1,000","1,250"],"a":1,"s":"A franchise deductible pays the full loss once it exceeds $d$: payment per loss $=E[(X-d)_+]+d\\,S(d)$.\n$=640+500(0.8)^3=640+256=896$."},{"id":"b5-9","m":5,"d":"e","l":"5.2","q":"An insurer expects 50 losses per year. Losses are Pareto with $\\alpha=3$ and $\\theta=2000$, and the policy has an ordinary deductible of 500. Calculate the expected annual payments.","c":["25,600","32,000","50,000","62,500"],"a":1,"s":"Expected payment per loss is 640, and all 50 losses count (including those with zero payment).\n$50(640)=32{,}000$."},{"id":"b5-10","m":5,"d":"e","l":"5.2","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. Next year losses are inflated by 25%, and the ordinary deductible stays at 500. Calculate next year's expected payment per loss.","c":["640","800","868.1","1,000"],"a":2,"s":"The inflated loss is Pareto with $\\alpha=3$ and $\\theta=1.25(2000)=2500$.\n$E[(Y-500)_+]=1250\\left(\\frac{2500}{3000}\\right)^2=868.1$."},{"id":"b5-11","m":5,"d":"e","l":"5.2","q":"Losses are equally likely to be 200, 400, 700, 1000 or 1500. A policy has an ordinary deductible of 500. Calculate the expected payment per payment.","c":["340","450","566.7","850"],"a":2,"s":"Payments per loss are $0,0,200,500,1000$. Only three losses produce payments.\nPer payment: $\\frac{200+500+1000}{3}=566.7$."},{"id":"b5-12","m":5,"d":"e","l":"5.2","q":"Losses are equally likely to be 200, 400, 700, 1000 or 1500. A policy has a franchise deductible of 500. Calculate the expected payment per payment.","c":["640","850","1,066.7","1,166.7"],"a":2,"s":"With a franchise deductible, the payments are the full losses that exceed 500: 700, 1000, 1500.\nPer payment: $\\frac{700+1000+1500}{3}=1066.7$."},{"id":"b5-13","m":5,"d":"e","l":"5.2","q":"Losses are exponential with mean 1000. A policy pays the portion of each loss between 500 and 2000 (nothing below 500, and at most 1500 per loss). Calculate the expected payment per loss.","c":["393.5","471.2","606.5","864.7"],"a":1,"s":"Payment $=(X\\wedge2000)-(X\\wedge500)$.\n$E=1000\\left(e^{-0.5}-e^{-2}\\right)=1000(0.6065-0.1353)=471.2$."},{"id":"b5-14","m":5,"d":"e","l":"5.3","q":"Losses are exponential with mean 1000. Calculate the loss elimination ratio for an ordinary deductible of 250.","c":["0.1175","0.2212","0.2500","0.7788"],"a":1,"s":"$\\text{LER}=\\frac{E[X\\wedge d]}{E[X]}=1-e^{-d/\\theta}=1-e^{-0.25}=0.2212$."},{"id":"b5-15","m":5,"d":"e","l":"5.3","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. Calculate the loss elimination ratio for an ordinary deductible of 500.","c":["0.2000","0.3600","0.4000","0.6400"],"a":1,"s":"$\\text{LER}=1-\\left(\\frac{\\theta}{\\theta+d}\\right)^{\\alpha-1}=1-(0.8)^2=0.36$."},{"id":"b5-16","m":5,"d":"e","l":"5.3","q":"Losses are equally likely to be 200, 400, 700, 1000 or 1500. Calculate the loss elimination ratio for an ordinary deductible of 500.","c":["0.2564","0.4474","0.5526","0.6579"],"a":2,"s":"$E[X\\wedge500]=\\frac{200+400+500+500+500}{5}=420$ and $E[X]=\\frac{3800}{5}=760$.\n$\\text{LER}=\\frac{420}{760}=0.5526$."},{"id":"b5-17","m":5,"d":"e","l":"5.3","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$, and a deductible of 500 applies. Losses will be inflated by 25% next year with the deductible unchanged. Calculate next year's loss elimination ratio.","c":["0.2000","0.3056","0.3600","0.4000"],"a":1,"s":"Next year's losses are Pareto with $\\alpha=3$ and $\\theta=2500$.\n$\\text{LER}=1-\\left(\\frac{2500}{3000}\\right)^2=1-0.6944=0.3056$."},{"id":"b5-18","m":5,"d":"e","l":"5.3","q":"Losses are exponential with mean 1000. What ordinary deductible gives a loss elimination ratio of 0.5?","c":["500.0","693.1","750.0","1,000.0"],"a":1,"s":"$1-e^{-d/1000}=0.5$, so $e^{-d/1000}=0.5$.\n$d=1000\\ln2=693.1$."},{"id":"b5-19","m":5,"d":"e","l":"5.4","q":"Losses are exponential with mean 1000. A policy has a deductible of 500, a maximum covered loss of 5000 and 80% coinsurance (the insurer pays 80% of the covered amount). Calculate the expected payment per loss.","c":["383.9","479.8","599.8","750.0"],"a":1,"s":"Payment $=0.8\\left[(X\\wedge5000)-(X\\wedge500)\\right]$.\n$E=0.8(1000)\\left(e^{-0.5}-e^{-5}\\right)=800(0.6065-0.0067)=479.8$."},{"id":"b5-20","m":5,"d":"e","l":"5.4","q":"Losses are exponential with mean 1000, and next year they will be inflated by 10%. A policy has a deductible of 500, a maximum covered loss of 5000 and 80% coinsurance, none of which change. Calculate next year's expected payment per loss.","c":["479.8","549.2","615.0","880.0"],"a":1,"s":"Next year's loss $Y=1.1X$ is exponential with $\\theta=1100$.\n$E=0.8(1100)\\left(e^{-500/1100}-e^{-5000/1100}\\right)=880(0.6347-0.0106)=549.2$."},{"id":"b5-21","m":5,"d":"e","l":"5.4","q":"Losses are exponential with mean 1000. A policy has an ordinary deductible of 500 and a maximum payment of 1500 per loss. Calculate the probability that a loss produces a payment equal to the maximum.","c":["0.1353","0.2231","0.3679","0.6065"],"a":0,"s":"The maximum payment of 1500 is reached when the loss exceeds $500+1500=2000$.\n$P(X>2000)=e^{-2}=0.1353$."},{"id":"b5-22","m":5,"d":"e","l":"5.4","q":"Total annual losses $S$ are uniform on $[0,3000]$. A producer receives a bonus of 20% of the amount by which 1500 exceeds $S$ (no bonus if $S\\ge1500$). Calculate the expected bonus.","c":["37.5","75.0","150.0","375.0"],"a":1,"s":"Bonus $=0.2(1500-S)_+$, so $E=0.2\\,E[(1500-S)_+]$.\n$E[(1500-S)_+]=\\int_0^{1500}\\frac{1500-s}{3000}ds=\\frac{1500^2/2}{3000}=375$.\nExpected bonus $=0.2(375)=75$."},{"id":"b6-1","m":6,"d":"e","l":"6.1","q":"Which property of a coherent risk measure does Value-at-Risk fail in general?","c":["Subadditivity","Monotonicity","Positive homogeneity","Translation invariance"],"a":0,"s":"VaR is monotonic, positively homogeneous and translation invariant. It can violate subadditivity: $\\text{VaR}(X+Y)$ may exceed $\\text{VaR}(X)+\\text{VaR}(Y)$."},{"id":"b6-2","m":6,"d":"e","l":"6.1","q":"$\\rho$ is a coherent risk measure with $\\rho(X)=40$. Calculate $\\rho(3X+10)$.","c":["50","120","130","150"],"a":2,"s":"Positive homogeneity gives $\\rho(3X)=3\\rho(X)=120$.\nTranslation invariance adds the constant: $\\rho(3X+10)=120+10=130$."},{"id":"b6-3","m":6,"d":"e","l":"6.1","q":"Which of the following risk measures is coherent?","c":["$\\text{VaR}_{0.95}$","$\\text{TVaR}_{0.95}$","The median","The mode"],"a":1,"s":"TVaR satisfies subadditivity, monotonicity, positive homogeneity and translation invariance. VaR (and so the median, which is $\\text{VaR}_{0.5}$) lacks subadditivity, and the mode is not a risk measure of this kind."},{"id":"b6-4","m":6,"d":"e","l":"6.1","q":"Two independent loans each lose 100 with probability 0.04 and lose nothing otherwise. Let $S$ be their total loss. Calculate $\\text{VaR}_{0.95}(S)$, defined as the smallest $x$ with $F(x)\\ge0.95$.","c":["0","50","100","200"],"a":2,"s":"$P(S=0)=0.96^2=0.9216<0.95$, so $F(0)<0.95$.\n$F(100)=0.9216+2(0.04)(0.96)=0.9984\\ge0.95$, so $\\text{VaR}_{0.95}(S)=100$.\nEach loan alone has $\\text{VaR}_{0.95}=0$, so $100>0+0$ shows VaR is not subadditive."},{"id":"b6-5","m":6,"d":"e","l":"6.2","q":"Losses are exponential with mean 1000. Calculate $\\text{VaR}_{0.99}$.","c":["2,303","2,996","3,912","4,605"],"a":3,"s":"$\\text{VaR}_p=-\\theta\\ln(1-p)=-1000\\ln0.01=4605$."},{"id":"b6-6","m":6,"d":"e","l":"6.2","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. Calculate $\\text{VaR}_{0.95}$.","c":["2,857.1","3,428.8","4,000.0","5,428.8"],"a":1,"s":"Solve $S(x)=0.05$: $\\left(\\frac{2000}{2000+x}\\right)^3=0.05$, so $2000+x=2000(0.05)^{-1/3}=5428.8$.\n$x=3428.8$."},{"id":"b6-7","m":6,"d":"e","l":"6.2","q":"Losses are lognormal with $\\mu=6$ and $\\sigma=1$. Calculate $\\text{VaR}_{0.95}$.","c":["1,102","2,090","2,512","3,160"],"a":1,"s":"$\\text{VaR}_p=e^{\\mu+\\sigma z_p}$ with $z_{0.95}=1.645$.\n$e^{6+1.645}=e^{7.645}=2090$."},{"id":"b6-8","m":6,"d":"e","l":"6.2","q":"$X$ takes the values 0, 100, 500 and 2000 with probabilities 0.5, 0.3, 0.15 and 0.05. Calculate $\\text{VaR}_{0.95}$, defined as the smallest $x$ with $F(x)\\ge0.95$.","c":["100","500","1,250","2,000"],"a":1,"s":"$F(0)=0.5$, $F(100)=0.8$, $F(500)=0.95$, $F(2000)=1$.\nThe smallest $x$ with $F(x)\\ge0.95$ is 500."},{"id":"b6-9","m":6,"d":"e","l":"6.3","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. Calculate $\\text{TVaR}_{0.95}$.","c":["4,857","5,429","6,143","6,857"],"a":2,"s":"$\\text{TVaR}_p=\\text{VaR}_p+e(\\text{VaR}_p)$, with $e(d)=\\frac{\\theta+d}{\\alpha-1}$.\n$\\text{VaR}_{0.95}=3428.8$, so $e=\\frac{5428.8}{2}=2714.4$ and $\\text{TVaR}_{0.95}=6143.2$."},{"id":"b6-10","m":6,"d":"e","l":"6.3","q":"Losses are uniform on $[0,1000]$. Calculate $\\text{TVaR}_{0.9}$.","c":["900","925","950","1,000"],"a":2,"s":"$\\text{VaR}_{0.9}=900$, and given $X>900$ the loss is uniform on $[900,1000]$.\n$\\text{TVaR}_{0.9}=\\frac{900+1000}{2}=950$."},{"id":"b6-11","m":6,"d":"e","l":"6.3","q":"$X$ takes the values 0, 100, 500 and 2000 with probabilities 0.5, 0.3, 0.15 and 0.05. Calculate $\\text{TVaR}_{0.9}$.","c":["500","875","1,250","2,000"],"a":2,"s":"$\\text{VaR}_{0.9}=500$ because $F(500)=0.95\\ge0.9$.\n$\\text{TVaR}_{0.9}=\\frac{(F(500)-0.9)(500)+2000(0.05)}{1-0.9}=\\frac{25+100}{0.1}=1250$.\nThe extra $(0.95-0.9)$ of probability at 500 must be counted. Using $E[X|X>500]=2000$ or $E[X|X\\ge500]=875$ is wrong."},{"id":"b6-12","m":6,"d":"e","l":"6.3","q":"Losses are exponential with mean 500. Calculate $\\text{TVaR}_{0.99}$.","c":["2,303","2,803","3,303","4,605"],"a":1,"s":"$\\text{VaR}_{0.99}=-500\\ln0.01=2302.6$.\nBy memorylessness, $\\text{TVaR}=\\text{VaR}+\\theta=2302.6+500=2802.6$."},{"id":"b6-13","m":6,"d":"e","l":"6.4","q":"Which distribution has the heaviest right tail?","c":["Exponential","Gamma with $\\alpha=2$","Weibull with $\\tau=2$","Pareto with $\\alpha=3$"],"a":3,"s":"The Pareto survival function decays like a power of $x$, while the others decay exponentially (or faster). Power decay is a heavier tail."},{"id":"b6-14","m":6,"d":"e","l":"6.4","q":"Which distribution has a decreasing hazard rate?","c":["Weibull with $\\tau=0.5$","Weibull with $\\tau=2$","Gamma with $\\alpha=2$","Uniform on $[0,1]$"],"a":0,"s":"A Weibull hazard is $\\frac{\\tau}{\\theta}\\left(\\frac{x}{\\theta}\\right)^{\\tau-1}$, which decreases when $\\tau<1$. The Weibull with $\\tau=2$, the gamma with $\\alpha>1$ and the uniform all have increasing hazard rates."},{"id":"b6-15","m":6,"d":"e","l":"6.4","q":"$X$ is Pareto with $\\alpha=3.5$. What is the largest integer $k$ for which $E[X^k]$ is finite?","c":["2","3","4","All moments are finite"],"a":1,"s":"A Pareto's raw moment of order $k$ exists only for $k<\\alpha$. With $\\alpha=3.5$, moments exist for $k=1,2,3$ but not $k=4$."},{"id":"b6-16","m":6,"d":"e","l":"6.4","q":"Losses are Pareto with $\\alpha=4$ and $\\theta=600$. Calculate the mean excess loss $e(300)$.","c":["200","300","450","900"],"a":1,"s":"$e(d)=\\frac{\\theta+d}{\\alpha-1}=\\frac{900}{3}=300$. Since this increases with $d$, the Pareto has a heavy tail."},{"id":"b6-17","m":6,"d":"e","l":"6.4","q":"$A$ is Pareto with $\\alpha=2$, $\\theta=100$ and $B$ is Pareto with $\\alpha=3$, $\\theta=100$. Find $\\lim_{x\\to\\infty}S_A(x)/S_B(x)$.","c":["0","1","100","Infinity"],"a":3,"s":"$\\frac{S_A(x)}{S_B(x)}=\\frac{100^2(100+x)^{-2}}{100^3(100+x)^{-3}}=\\frac{100+x}{100}\\to\\infty$. So $A$ has the heavier tail."},{"id":"b6-18","m":6,"d":"e","l":"6.5","q":"The maximum of many independent exponential random variables, suitably normalized, converges to which extreme value distribution?","c":["Gumbel","Fréchet","Weibull","Normal"],"a":0,"s":"Light-tailed distributions with exponentially decaying tails (exponential, gamma, normal, lognormal) are in the Gumbel domain of attraction."},{"id":"b6-19","m":6,"d":"e","l":"6.5","q":"The maximum of many independent Pareto random variables, suitably normalized, converges to which extreme value distribution?","c":["Gumbel","Fréchet","Weibull","Normal"],"a":1,"s":"Heavy-tailed distributions with power-law tails, such as the Pareto, are in the Fréchet domain of attraction."},{"id":"b6-20","m":6,"d":"e","l":"6.5","q":"$X$ has a Fréchet distribution with $F(x)=\\exp\\left[-(x/\\theta)^{-\\alpha}\\right]$, where $\\alpha=2$ and $\\theta=100$. Calculate $P(X\\le200)$.","c":["0.2212","0.6065","0.7788","0.9394"],"a":2,"s":"$F(200)=\\exp\\left[-\\left(\\frac{200}{100}\\right)^{-2}\\right]=e^{-0.25}=0.7788$."},{"id":"b7-1","m":7,"d":"e","l":"7.1","q":"$N$ is binomial with $m=10$ and $q=0.3$, a member of the $(a,b,0)$ class with $p_k=\\left(a+\\frac bk\\right)p_{k-1}$. Calculate $a$.","c":["-0.7000","-0.4286","0.4286","0.7000"],"a":1,"s":"For the binomial, $a=-\\frac{q}{1-q}=-\\frac{0.3}{0.7}=-0.4286$ and $b=\\frac{(m+1)q}{1-q}=4.714$."},{"id":"b7-2","m":7,"d":"e","l":"7.1","q":"$N$ is negative binomial with $r=3$ and $\\beta=2$. Calculate $P(N\\ge2)$.","c":["0.0988","0.1111","0.8889","0.9630"],"a":2,"s":"$p_0=(1+\\beta)^{-r}=\\frac1{27}=0.0370$ and $p_1=\\frac{r\\beta}{(1+\\beta)^{r+1}}=\\frac{6}{81}=0.0741$.\n$P(N\\ge2)=1-0.0370-0.0741=0.8889$."},{"id":"b7-3","m":7,"d":"e","l":"7.1","q":"For an $(a,b,0)$ distribution, $\\frac{p_1}{p_0}=0.75$ and $\\frac{p_2}{p_1}=0.5$. Calculate $\\frac{p_3}{p_2}$.","c":["0.3750","0.4167","0.4500","0.5000"],"a":1,"s":"$a+b=0.75$ and $a+\\frac b2=0.5$, so $\\frac b2=0.25$, $b=0.5$ and $a=0.25$.\n$\\frac{p_3}{p_2}=a+\\frac b3=0.25+0.1667=0.4167$."},{"id":"b7-4","m":7,"d":"e","l":"7.1","q":"$N$ is an $(a,b,0)$ distribution with $a=-0.25$ and $b=2$. Calculate $P(N=0)$.","c":["0.1678","0.2097","0.2621","0.3277"],"a":1,"s":"A negative $a$ means a binomial: $a=-\\frac{q}{1-q}=-0.25$ gives $q=0.2$.\n$b=\\frac{(m+1)q}{1-q}=0.25(m+1)=2$, so $m=7$.\n$p_0=(1-q)^m=0.8^7=0.2097$."},{"id":"b7-5","m":7,"d":"e","l":"7.1","q":"$N$ is Poisson with $P(N=0)=0.2$. Calculate $P(N=2)$.","c":["0.1610","0.2590","0.3219","0.5181"],"a":1,"s":"$e^{-\\lambda}=0.2$, so $\\lambda=\\ln5=1.6094$.\n$P(N=2)=e^{-\\lambda}\\frac{\\lambda^2}{2}=0.2(1.2951)=0.2590$."},{"id":"b7-6","m":7,"d":"e","l":"7.2","q":"$N^T$ is a zero-truncated geometric distribution with $\\beta=2$. Calculate $E[N^T]$.","c":["2","3","4","6"],"a":1,"s":"For the untruncated geometric, $E[N]=\\beta=2$ and $p_0=\\frac1{1+\\beta}=\\frac13$.\n$E[N^T]=\\frac{E[N]}{1-p_0}=\\frac{2}{2/3}=3$. (Equivalently, $N^T=1+$ geometric, so the mean is $1+\\beta=3$.)"},{"id":"b7-7","m":7,"d":"e","l":"7.2","q":"$N^M$ is a zero-modified Poisson with $\\lambda=2$ and $P(N^M=0)=0.5$. Calculate $P(N^M=1)$.","c":["0.1353","0.1565","0.2707","0.3130"],"a":1,"s":"$p_k^M=\\frac{1-p_0^M}{1-p_0}p_k$ for $k\\ge1$, with $p_0=e^{-2}=0.1353$ and $p_1=2e^{-2}=0.2707$.\n$p_1^M=\\frac{0.5}{0.8647}(0.2707)=0.1565$."},{"id":"b7-8","m":7,"d":"e","l":"7.2","q":"$N^M$ is a zero-modified Poisson with $\\lambda=2$ and $P(N^M=0)=0.5$. Calculate $E[N^M]$.","c":["1.000","1.157","2.000","2.313"],"a":1,"s":"$E[N^M]=\\frac{1-p_0^M}{1-p_0}E[N]=\\frac{0.5}{0.8647}(2)=1.157$."},{"id":"b7-9","m":7,"d":"e","l":"7.2","q":"$N^T$ is a zero-truncated negative binomial with $r=2$ and $\\beta=1$. Calculate $P(N^T=3)$.","c":["0.1250","0.1667","0.1875","0.2500"],"a":1,"s":"For the untruncated NB, $p_0=\\frac14$ and $p_3=\\frac{r(r+1)(r+2)}{3!}\\frac{\\beta^3}{(1+\\beta)^{r+3}}=\\frac{4}{32}=0.125$.\n$p_3^T=\\frac{p_3}{1-p_0}=\\frac{0.125}{0.75}=0.1667$."},{"id":"b7-10","m":7,"d":"e","l":"7.3","q":"Given $\\Lambda$, $N$ is Poisson with mean $\\Lambda$, and $\\Lambda$ is gamma with $\\alpha=2$ and $\\theta=1.5$. Calculate $P(N=0)$.","c":["0.0625","0.1600","0.2500","0.4000"],"a":1,"s":"Unconditionally, $N$ is negative binomial with $r=\\alpha=2$ and $\\beta=\\theta=1.5$.\n$P(N=0)=(1+\\beta)^{-r}=2.5^{-2}=0.16$."},{"id":"b7-11","m":7,"d":"e","l":"7.3","q":"Given $\\Lambda$, $N$ is Poisson with mean $\\Lambda$, and $\\Lambda$ is gamma with $\\alpha=4$ and $\\theta=0.25$. Calculate $\\operatorname{Var}(N)$.","c":["1.000","1.250","1.500","2.000"],"a":1,"s":"$N$ is negative binomial with $r=4$ and $\\beta=0.25$.\n$\\operatorname{Var}(N)=r\\beta(1+\\beta)=4(0.25)(1.25)=1.25$."},{"id":"b7-12","m":7,"d":"e","l":"7.3","q":"Annual claim counts are Poisson with mean $\\Lambda$, where $\\Lambda$ has a gamma prior with $\\alpha=2$ and $\\theta=1.5$. An insured has 5 claims in 2 years. Calculate the expected number of claims next year.","c":["2.500","2.625","3.000","3.500"],"a":1,"s":"Posterior: $\\alpha'=\\alpha+\\text{claims}=7$ and $\\frac1{\\theta'}=\\frac1\\theta+\\text{years}=\\frac{1}{1.5}+2=2.667$, so $\\theta'=0.375$.\nExpected claims next year $=\\alpha'\\theta'=7(0.375)=2.625$."},{"id":"b7-13","m":7,"d":"e","l":"7.3","q":"Annual claim counts are Poisson with mean $\\Lambda$, where $\\Lambda$ has a gamma prior with $\\alpha=2$ and $\\theta=1.5$. An insured has 5 claims in 2 years. Calculate the probability of no claims next year.","c":["0.0625","0.1076","0.1353","0.2500"],"a":1,"s":"The posterior of $\\Lambda$ is gamma with $\\alpha'=7$ and $\\theta'=0.375$.\nNext year's count is negative binomial with $r=7$ and $\\beta=0.375$: $P(N=0)=(1.375)^{-7}=0.1076$."},{"id":"b7-14","m":7,"d":"e","l":"7.4","q":"The annual claim count for one exposure unit is negative binomial with $r=2$ and $\\beta=0.5$. Exposure triples, with units independent. Calculate the variance of the new claim count.","c":["1.5","4.5","7.5","13.5"],"a":1,"s":"Independent negative binomials with the same $\\beta$ add by summing $r$: the new count has $r=6$ and $\\beta=0.5$.\n$\\operatorname{Var}=r\\beta(1+\\beta)=6(0.5)(1.5)=4.5$."},{"id":"b7-15","m":7,"d":"e","l":"7.4","q":"The number of losses is Poisson with mean 5, and each loss independently exceeds the deductible with probability 0.6. Calculate the probability of no payments.","c":["0.0067","0.0498","0.1353","0.3679"],"a":1,"s":"The number of payments is Poisson with mean $5(0.6)=3$.\n$P(\\text{no payments})=e^{-3}=0.0498$."},{"id":"b7-16","m":7,"d":"e","l":"7.4","q":"The number of losses is negative binomial with $r=3$ and $\\beta=1.5$. Each loss independently exceeds the deductible with probability 0.4. Calculate the variance of the number of payments.","c":["1.80","2.88","4.50","11.25"],"a":1,"s":"The number of payments is negative binomial with the same $r=3$ and $\\beta'=v\\beta=0.4(1.5)=0.6$.\n$\\operatorname{Var}=r\\beta'(1+\\beta')=3(0.6)(1.6)=2.88$."},{"id":"b7-17","m":7,"d":"e","l":"7.4","q":"The number of losses is binomial with $m=10$ and $q=0.3$. Each loss independently exceeds the deductible with probability 0.5. Calculate the probability of no payments.","c":["0.0282","0.1969","0.2824","0.5000"],"a":1,"s":"The number of payments is binomial with $m=10$ and $q'=0.3(0.5)=0.15$.\n$P(\\text{none})=0.85^{10}=0.1969$."},{"id":"b7-18","m":7,"d":"e","l":"7.4","q":"The number of losses is Poisson with mean 10, and loss sizes are exponential with mean 1000. A policy has an ordinary deductible of 500. Calculate the expected number of payments.","c":["3.935","5.000","6.065","10.000"],"a":2,"s":"$P(X>500)=e^{-0.5}=0.6065$, so payments are Poisson with mean $10(0.6065)=6.065$."},{"id":"b8-1","m":8,"d":"e","l":"8.1","q":"Claim count $N$ is Poisson with mean 4. Severity has mean 200 and standard deviation 100. Calculate $\\operatorname{Var}(S)$.","c":["40,000","160,000","200,000","800,000"],"a":2,"s":"Compound Poisson: $\\operatorname{Var}(S)=\\lambda E[X^2]=4(100^2+200^2)=4(50{,}000)=200{,}000$.\n(Using $\\lambda\\operatorname{Var}(X)=40{,}000$ is a common mistake.)"},{"id":"b8-2","m":8,"d":"e","l":"8.1","q":"Claim count $N$ is negative binomial with $r=3$ and $\\beta=2$. Severity has mean 100 and variance 2500. Calculate $\\operatorname{Var}(S)$.","c":["15,000","60,000","195,000","240,000"],"a":2,"s":"$E[N]=r\\beta=6$ and $\\operatorname{Var}(N)=r\\beta(1+\\beta)=18$.\n$\\operatorname{Var}(S)=E[N]\\operatorname{Var}(X)+\\operatorname{Var}(N)E[X]^2=6(2500)+18(10{,}000)=195{,}000$."},{"id":"b8-3","m":8,"d":"e","l":"8.1","q":"Claim count $N$ is binomial with $m=10$ and $q=0.2$. Severity has mean 50 and variance 400. Calculate $\\operatorname{Var}(S)$.","c":["800","3,200","4,800","5,000"],"a":2,"s":"$E[N]=2$ and $\\operatorname{Var}(N)=10(0.2)(0.8)=1.6$.\n$\\operatorname{Var}(S)=2(400)+1.6(2500)=800+4000=4800$."},{"id":"b8-4","m":8,"d":"e","l":"8.1","q":"$N$ equals 0, 1 or 2 with probabilities 0.5, 0.3, 0.2. Severity has mean 100 and variance 400. Calculate $\\operatorname{Var}(S)$.","c":["280","6,100","6,380","7,000"],"a":2,"s":"$E[N]=0.7$ and $E[N^2]=0.3+4(0.2)=1.1$, so $\\operatorname{Var}(N)=1.1-0.49=0.61$.\n$\\operatorname{Var}(S)=0.7(400)+0.61(10{,}000)=280+6100=6380$."},{"id":"b8-5","m":8,"d":"e","l":"8.2","q":"Claim count is Poisson with mean 50 and severity is exponential with mean 100. Use the normal approximation to estimate $P(S>6500)$.","c":["0.0228","0.0668","0.1587","0.2420"],"a":1,"s":"$E[S]=50(100)=5000$ and $\\operatorname{Var}(S)=\\lambda E[X^2]=50(2\\times10^4)=10^6$, so $\\sigma=1000$.\n$z=\\frac{6500-5000}{1000}=1.5$ and $P=1-\\Phi(1.5)=0.0668$."},{"id":"b8-6","m":8,"d":"e","l":"8.2","q":"Aggregate losses have mean 1000 and variance 360,000. Approximate $S$ by a lognormal distribution matching these moments, and estimate $P(S>1500)$.","c":["0.0668","0.1566","0.2236","0.3085"],"a":1,"s":"$1+\\text{CV}^2=e^{\\sigma^2}$: $1.36=e^{\\sigma^2}$, so $\\sigma^2=0.3075$ and $\\sigma=0.5545$.\n$\\mu=\\ln1000-\\frac{\\sigma^2}2=6.754$, so $z=\\frac{\\ln1500-6.754}{0.5545}=1.008$.\n$P(S>1500)=1-\\Phi(1.008)=0.1566$."},{"id":"b8-7","m":8,"d":"e","l":"8.2","q":"Aggregate losses have mean 1000 and variance 250,000. Approximate $S$ by a gamma distribution matching these moments, and estimate $P(S>1500)$.","c":["0.0620","0.1512","0.2851","0.4457"],"a":1,"s":"$\\alpha\\theta=1000$ and $\\alpha\\theta^2=250{,}000$, so $\\theta=250$ and $\\alpha=4$.\nFor integer $\\alpha$, $P(S>1500)=P(\\text{Poisson}(6)\\le3)=e^{-6}\\left(1+6+18+36\\right)=0.1512$."},{"id":"b8-8","m":8,"d":"e","l":"8.2","q":"Claim count is Poisson with mean 10 and severity is exponential with mean 100. Calculate the skewness of $S$.","c":["0.2236","0.6708","1.0000","2.0000"],"a":1,"s":"For compound Poisson, $\\text{skewness}=\\frac{\\lambda E[X^3]}{(\\lambda E[X^2])^{3/2}}$.\n$E[X^2]=2\\times10^4$, $E[X^3]=6\\times10^6$: $\\frac{10(6\\times10^6)}{(2\\times10^5)^{1.5}}=\\frac{6\\times10^7}{8.944\\times10^7}=0.6708$."},{"id":"b8-9","m":8,"d":"e","l":"8.3","q":"Loss count is Poisson with mean 20 and loss sizes are exponential with mean 1000. A policy has an ordinary deductible of 500. Calculate the variance of total payments.","c":["12,130,600","24,261,200","40,000,000","48,522,400"],"a":1,"s":"The number of payments is Poisson with mean $20e^{-0.5}=12.131$.\nBy memorylessness, each payment is exponential with mean 1000, so $E[Y^2]=2\\times10^6$.\n$\\operatorname{Var}(S)=12.131(2\\times10^6)=24{,}261{,}200$."},{"id":"b8-10","m":8,"d":"e","l":"8.3","q":"Loss count is Poisson with mean 10 and loss sizes are Pareto with $\\alpha=3$ and $\\theta=2000$. Each loss has a limit of 3000. Calculate the expected aggregate payment.","c":["6,000","8,400","10,000","16,800"],"a":1,"s":"$E[X\\wedge3000]=1000\\left[1-\\left(\\frac{2000}{5000}\\right)^2\\right]=1000(0.84)=840$.\n$E[S]=10(840)=8400$."},{"id":"b8-11","m":8,"d":"e","l":"8.3","q":"Loss count is negative binomial with $r=2$ and $\\beta=1.5$. Loss sizes are exponential with mean 1000, and there is an ordinary deductible of 500. Calculate the expected aggregate payment.","c":["1,213","1,820","2,000","3,000"],"a":1,"s":"$P(X>500)=e^{-0.5}=0.6065$, so the payment count is negative binomial with $r=2$ and $\\beta'=0.6065(1.5)=0.9098$.\n$E[N_P]=2(0.9098)=1.8196$, and each payment has mean 1000.\n$E[S]=1820$."},{"id":"b8-12","m":8,"d":"e","l":"8.3","q":"Loss count is Poisson with mean 10 and losses are Pareto with $\\alpha=3$ and $\\theta=2000$. Next year losses will be inflated by 25% with an ordinary per-loss deductible of 500 unchanged. Calculate next year's expected aggregate payment.","c":["6,400","7,812","8,681","10,000"],"a":2,"s":"Inflated losses are Pareto with $\\alpha=3$ and $\\theta=2500$.\n$E[(Y-500)_+]=\\frac{\\theta}{\\alpha-1}\\left(\\frac{\\theta}{\\theta+500}\\right)^2=1250\\left(\\frac{2500}{3000}\\right)^2=868.06$.\n$E[S]=10(868.06)=8681$."},{"id":"b8-13","m":8,"d":"e","l":"8.4","q":"$N$ is Poisson with $\\lambda=2$, and severity is 1 or 2 with probability 0.5 each. Using the recursive formula, calculate $P(S=3)$.","c":["0.1353","0.1579","0.2030","0.2707"],"a":1,"s":"$g_k=\\frac\\lambda k\\sum_{j=1}^kj f_jg_{k-j}$ with $g_0=e^{-2}=0.1353$.\n$g_1=2(0.5)g_0=0.1353$, $g_2=\\frac22\\left[0.5g_1+2(0.5)g_0\\right]=0.2030$.\n$g_3=\\frac23\\left[0.5g_2+2(0.5)g_1\\right]=\\frac23(0.2368)=0.1579$."},{"id":"b8-14","m":8,"d":"e","l":"8.4","q":"$N$ is Poisson with $\\lambda=2$, and severity is 1 or 2 with probability 0.5 each. Calculate $P(S\\le2)$.","c":["0.2030","0.3383","0.4737","0.6767"],"a":2,"s":"$g_0=0.1353$, $g_1=0.1353$ and $g_2=0.2030$ from the recursion $g_k=\\frac2k\\sum_jjf_jg_{k-j}$.\n$P(S\\le2)=0.1353+0.1353+0.2030=0.4737$."},{"id":"b8-15","m":8,"d":"e","l":"8.4","q":"$N$ is negative binomial with $r=2$ and $\\beta=1$. Severity is 1 with probability 0.6 and 2 with probability 0.4. Using the $(a,b,0)$ recursion, calculate $P(S=2)$.","c":["0.1000","0.1500","0.1675","0.2500"],"a":2,"s":"$a=\\frac{\\beta}{1+\\beta}=0.5$, $b=\\frac{(r-1)\\beta}{1+\\beta}=0.5$, and $g_0=p_0=0.25$.\n$g_k=\\sum_{j=1}^k\\left(a+\\frac{bj}{k}\\right)f_jg_{k-j}$ (since $f_0=0$).\n$g_1=(0.5+0.5)(0.6)(0.25)=0.15$.\n$g_2=(0.5+0.25)(0.6)(0.15)+(0.5+0.5)(0.4)(0.25)=0.0675+0.1=0.1675$."},{"id":"b8-16","m":8,"d":"e","l":"8.4","q":"$N$ is Poisson with mean 3. Each claim is zero with probability 0.2 (and otherwise positive). Calculate $P(S=0)$.","c":["0.0498","0.0907","0.2000","0.2466"],"a":1,"s":"$S=0$ when every claim is zero: $P(S=0)=P_N(f_0)=e^{\\lambda(f_0-1)}=e^{3(0.2-1)}=e^{-2.4}=0.0907$. (Not $e^{-3}$, because zero claims do not add anything.)"},{"id":"b8-17","m":8,"d":"e","l":"8.5","q":"$S$ takes the values 0, 100, 200, 300 with probabilities 0.4, 0.3, 0.2, 0.1. Calculate $E[(S-150)_+]$.","c":["15","25","35","45"],"a":1,"s":"Only $S=200$ and $S=300$ exceed 150.\n$E[(S-150)_+]=0.2(50)+0.1(150)=10+15=25$."},{"id":"b8-18","m":8,"d":"e","l":"8.5","q":"$S$ takes the values 0, 500, 1000, 2000 with probabilities 0.5, 0.3, 0.15, 0.05. An aggregate deductible of 800 applies. Calculate the expected payment.","c":["60","90","110","150"],"a":1,"s":"$E[(S-800)_+]=0.15(1000-800)+0.05(2000-800)=30+60=90$."},{"id":"b8-19","m":8,"d":"e","l":"8.5","q":"$S$ takes only multiples of 100. You are given $E[(S-100)_+]=30$ and $E[(S-200)_+]=18$. Calculate $E[(S-130)_+]$.","c":["18.0","24.0","26.4","30.0"],"a":2,"s":"For a lattice distribution, $E[(S-d)_+]$ is linear between lattice points.\n$E[(S-130)_+]=30+0.3(18-30)=26.4$."},{"id":"b8-20","m":8,"d":"e","l":"8.5","q":"Aggregate losses are approximately normal with mean 1000 and standard deviation 200. Calculate the expected payment for an aggregate deductible of 1200.","c":["8.3","16.7","33.3","41.1"],"a":1,"s":"$z=\\frac{1200-1000}{200}=1$.\n$E[(S-d)_+]=\\sigma\\left[\\phi(z)-z\\left(1-\\Phi(z)\\right)\\right]=200(0.2420-0.1587)=16.7$."},{"id":"b8-21","m":8,"d":"e","l":"8.6","q":"Severity $X$ is exponential with mean 200. It is discretized by the method of rounding with span $h=100$, so $f_k=F(100k+50)-F(100k-50)$ for $k\\ge1$. Calculate $f_1$.","c":["0.2212","0.3064","0.3935","0.4724"],"a":1,"s":"$f_1=F(150)-F(50)=e^{-50/200}-e^{-150/200}=0.7788-0.4724=0.3064$."},{"id":"b8-22","m":8,"d":"e","l":"8.6","q":"Severity $X$ is exponential with mean 200 and is discretized with span $h=100$ by local moment matching of the first moment. Calculate $f_0$.","c":["0.2131","0.2212","0.3935","0.7869"],"a":0,"s":"With first-moment matching, $f_0=1-\\frac{E[X\\wedge h]}{h}$.\n$E[X\\wedge100]=200(1-e^{-0.5})=78.69$, so $f_0=1-0.7869=0.2131$."},{"id":"b8-23","m":8,"d":"e","l":"8.6","q":"$N$ equals 0, 1 or 2 with probabilities 0.4, 0.4, 0.2. Severity is 1 or 2 with probability 0.5 each. Calculate $P(S=2)$ by direct convolution.","c":["0.2000","0.2500","0.3000","0.3500"],"a":1,"s":"$S=2$ occurs with $N=1$ and $X=2$, or with $N=2$ and $X_1=X_2=1$.\n$P(S=2)=0.4(0.5)+0.2(0.5)^2=0.20+0.05=0.25$."},{"id":"h-1","m":1,"d":"h","l":"1.1","q":"$X$ has hazard rate $h(x)=0.01$ for $0<x<50$ and $h(x)=0.03$ for $x\\ge50$. Calculate $E[X]$.","c":["50.0","55.0","59.6","66.7"],"a":2,"s":"$S(x)=e^{-0.01x}$ for $x\\le50$, so $S(50)=e^{-0.5}$. For $x>50$, $S(x)=e^{-0.5}e^{-0.03(x-50)}$.\n$E[X]=\\int_0^\\infty S(x)dx=\\frac{1-e^{-0.5}}{0.01}+\\frac{e^{-0.5}}{0.03}=39.35+20.22=59.6$."},{"id":"h-2","m":1,"d":"h","l":"1.3","q":"Drivers are type A (50%, Poisson claim mean 1), type B (30%, mean 2) or type C (20%, mean 4). A randomly chosen driver has exactly 2 claims this year. Calculate the expected number of claims next year for this driver.","c":["1.750","1.835","1.900","2.333"],"a":1,"s":"Posterior weights are proportional to prior $\\times$ $P(N=2)$: $0.5(0.1839)=0.0920$, $0.3(0.2707)=0.0812$, $0.2(0.1465)=0.0293$. Their sum is $0.2025$.\nPosterior probabilities: $0.454$, $0.401$, $0.145$.\n$E=0.454(1)+0.401(2)+0.145(4)=1.835$. (The prior mean is 1.9.)"},{"id":"h-3","m":1,"d":"h","l":"1.4","q":"$X$ has moment generating function $M(t)=0.4(1-100t)^{-1}+0.6e^{50t}$. Calculate $\\operatorname{Var}(X)$.","c":["4,600","5,000","9,500","11,400"],"a":0,"s":"This is a mixture: with probability 0.4, $X$ is exponential with mean 100; with probability 0.6, $X=50$ exactly.\n$E[X]=0.4(100)+0.6(50)=70$ and $E[X^2]=0.4(2)(100^2)+0.6(50^2)=9500$.\n$\\operatorname{Var}=9500-70^2=4600$."},{"id":"h-4","m":2,"d":"h","l":"2.2","q":"$X$ is lognormal with $\\mu=6$ and $\\sigma=1$. Calculate $E[X\\wedge1000]$.","c":["403.4","490.1","665.1","1,000.0"],"a":1,"s":"$E[X\\wedge d]=e^{\\mu+\\sigma^2/2}\\,\\Phi\\!\\left(\\frac{\\ln d-\\mu-\\sigma^2}{\\sigma}\\right)+d\\left[1-\\Phi\\!\\left(\\frac{\\ln d-\\mu}{\\sigma}\\right)\\right]$.\n$\\ln1000=6.9078$. First term: $665.14\\,\\Phi(-0.092)=665.14(0.4633)=308.2$.\nSecond term: $1000[1-\\Phi(0.908)]=1000(0.1820)=182.0$. Total $\\approx490.1$."},{"id":"h-5","m":2,"d":"h","l":"2.2","q":"$X$ is gamma with $\\alpha=3$ and $\\theta=100$. Calculate $E[X\\wedge300]$.","c":["214.5","232.8","268.0","300.0"],"a":1,"s":"$E[X\\wedge d]=\\alpha\\theta\\,\\Gamma(\\alpha+1;d/\\theta)+d\\,S(d)$, with $d/\\theta=3$.\n$\\Gamma(4;3)=1-e^{-3}(1+3+4.5+4.5)=0.3528$, so the first term is $300(0.3528)=105.8$.\n$S(300)=e^{-3}(1+3+4.5)=0.4232$, so the second term is $300(0.4232)=127.0$. Total $232.8$."},{"id":"h-6","m":2,"d":"h","l":"2.1","q":"$X$ is gamma with $\\alpha=4$ and $\\theta=0.5$, and $Y=1/X$. Calculate $\\operatorname{Var}(Y)$.","c":["0.1111","0.2222","0.4444","0.6667"],"a":1,"s":"$Y$ is inverse gamma. For $k<\\alpha$, $E[Y^k]=\\frac{\\theta^{-k}}{(\\alpha-1)(\\alpha-2)\\cdots(\\alpha-k)}$.\n$E[Y]=\\frac{1}{0.5(3)}=0.6667$ and $E[Y^2]=\\frac{1}{0.25(3)(2)}=0.6667$.\n$\\operatorname{Var}(Y)=0.6667-0.4444=0.2222$."},{"id":"h-7","m":3,"d":"h","l":"3.1","q":"$X$, $Y$, $Z$ have variances 4, 9, 16. $\\operatorname{Corr}(X,Y)=0.5$, $\\operatorname{Corr}(Y,Z)=-0.25$, and $X$ and $Z$ are independent. Calculate $\\operatorname{Var}(X+2Y-Z)$.","c":["56","68","80","92"],"a":2,"s":"$\\operatorname{Cov}(X,Y)=0.5(2)(3)=3$, $\\operatorname{Cov}(Y,Z)=-0.25(3)(4)=-3$, $\\operatorname{Cov}(X,Z)=0$.\n$\\operatorname{Var}=4+4(9)+16+2(1)(2)(3)+2(2)(-1)(-3)=4+36+16+12+12=80$."},{"id":"h-8","m":3,"d":"h","l":"3.2","q":"An insurer writes $n$ independent policies, each with mean loss 100 and standard deviation 150. Total premium is 120% of expected total losses. Using the normal approximation (with $z_{0.99}=2.326$), find the smallest $n$ such that the probability that total losses exceed the premium is at most 1%.","c":["218","272","305","340"],"a":2,"s":"The loading is $0.2(100n)=20n$, and $\\sigma_S=150\\sqrt n$.\nRequire $\\frac{20n}{150\\sqrt n}\\ge2.326$, so $\\sqrt n\\ge17.445$ and $n\\ge304.3$.\nThe smallest integer is 305."},{"id":"h-9","m":3,"d":"h","l":"3.3","q":"10 independent policies each pay 1000 with probability 0.1 (otherwise 0). Another 20 independent policies each pay 500 with probability 0.2 (otherwise 0). Calculate the standard deviation of total payments.","c":["1,304","1,414","1,844","1,700,000"],"a":0,"s":"Bernoulli shortcut for each group: $10(1000^2)(0.1)(0.9)=900{,}000$ and $20(500^2)(0.2)(0.8)=800{,}000$.\n$\\operatorname{Var}=1{,}700{,}000$, so the standard deviation is $\\sqrt{1{,}700{,}000}=1304$."},{"id":"h-10","m":4,"d":"h","l":"4.1","q":"With probability 0.5, $X$ is exponential with mean 200; with probability 0.5, it is Pareto with $\\alpha=3$ and $\\theta=400$. Calculate the mean excess loss $e(500)=E[X-500\\,|\\,X>500]$.","c":["200.0","325.0","329.2","450.0"],"a":2,"s":"Mean excess $=\\frac{E[(X-500)_+]}{S(500)}$, and both numerator and denominator are mixtures.\nExponential: $E[(X-500)_+]=200e^{-2.5}=16.42$, $S(500)=e^{-2.5}=0.0821$.\nPareto: $E[(X-500)_+]=200\\left(\\frac{400}{900}\\right)^2=39.51$, $S(500)=\\left(\\frac49\\right)^3=0.0878$.\n$e(500)=\\frac{0.5(16.42+39.51)}{0.5(0.0821+0.0878)}=\\frac{27.96}{0.0849}=329.2$. Averaging the two components' mean excesses (200 and 450) is wrong."},{"id":"h-11","m":4,"d":"h","l":"4.2","q":"Given $\\Lambda$, $S(x|\\Lambda)=\\exp(-\\Lambda x^2/100)$. $\\Lambda$ is gamma with $\\alpha=2$ and $\\theta=0.5$. Calculate $P(X>10\\,|\\,X>5)$.","c":["0.4444","0.5625","0.6667","0.7901"],"a":1,"s":"$S(x)=M_\\Lambda(-x^2/100)=\\left(1+\\frac{0.5x^2}{100}\\right)^{-2}$.\n$S(10)=1.5^{-2}=0.4444$ and $S(5)=1.125^{-2}=0.7901$.\n$P(X>10|X>5)=\\frac{0.4444}{0.7901}=0.5625$."},{"id":"h-12","m":4,"d":"h","l":"4.4","q":"A spliced density is $f(x)=w\\,\\frac{g_1(x)}{G_1(1000)}$ for $0<x<1000$, where $g_1$ is the exponential density with mean 500. For $x>1000$, $f(x)=(1-w)\\frac{g_2(x)}{S_2(1000)}$, where $g_2$ is the Pareto density with $\\alpha=2$ and $\\theta=1000$. If $f$ is continuous at 1000, calculate $w$.","c":["0.5000","0.6321","0.7616","0.8647"],"a":2,"s":"Left limit: $w\\cdot\\frac{\\frac1{500}e^{-2}}{1-e^{-2}}=w(0.002)(0.1565)=0.000313\\,w$.\nRight limit: $g_2(1000)=\\frac{2(1000^2)}{2000^3}=0.00025$ and $S_2(1000)=0.25$, so $(1-w)(0.001)$.\n$0.000313w=0.001(1-w)$ gives $w=\\frac{0.001}{0.001313}=0.7616$."},{"id":"h-13","m":5,"d":"h","l":"5.4","q":"Ground-up losses are Pareto with $\\alpha=3$ and $\\theta=2000$. Losses will be inflated by 20%. The policy then applies an ordinary deductible of 500, a maximum covered loss of 4000 and 75% coinsurance. Calculate the expected payment per payment.","c":["489.8","654.0","864.2","1,152.3"],"a":2,"s":"Inflated loss $Y=1.2X$ is Pareto with $\\theta=2400$: $E[Y\\wedge u]=1200\\left[1-\\left(\\frac{2400}{2400+u}\\right)^2\\right]$.\n$E[Y\\wedge4000]=1200(1-0.1406)=1031.3$ and $E[Y\\wedge500]=1200(1-0.6849)=378.1$.\nPayment per loss $=0.75(1031.3-378.1)=489.8$.\n$P(\\text{payment})=S_Y(500)=\\left(\\frac{2400}{2900}\\right)^3=0.5668$, so per payment $=\\frac{489.8}{0.5668}=864.2$."},{"id":"h-14","m":5,"d":"h","l":"5.2","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=2000$. What ordinary deductible gives a loss elimination ratio of 0.4?","c":["400","582","700","1,000"],"a":1,"s":"$\\text{LER}=1-\\left(\\frac{\\theta}{\\theta+d}\\right)^{\\alpha-1}=0.4$, so $\\left(\\frac{2000}{2000+d}\\right)^2=0.6$.\n$2000+d=\\frac{2000}{\\sqrt{0.6}}=2582$, so $d=582$."},{"id":"h-15","m":5,"d":"h","l":"5.3","q":"Losses are exponential with mean 1000 and there is an ordinary deductible of 500. Calculate the variance of the payment per loss.","c":["367,879","606,531","845,182","1,213,061"],"a":2,"s":"Payment $Y=(X-500)_+$. By memorylessness, given $X>500$ the payment is exponential with mean 1000.\n$E[Y]=e^{-0.5}(1000)=606.5$ and $E[Y^2]=e^{-0.5}(2)(1000^2)=1{,}213{,}061$.\n$\\operatorname{Var}(Y)=1{,}213{,}061-606.5^2=845{,}182$."},{"id":"h-16","m":6,"d":"h","l":"6.3","q":"Losses are lognormal with $\\mu=6$ and $\\sigma=1$. Calculate $\\text{TVaR}_{0.95}$.","c":["2,090","2,816","3,452","4,100"],"a":2,"s":"$\\text{TVaR}_p=\\frac{e^{\\mu+\\sigma^2/2}\\,\\Phi(\\sigma-z_p)}{1-p}$, with $z_{0.95}=1.645$ and $e^{6.5}=665.14$.\n$\\Phi(1-1.645)=\\Phi(-0.645)=0.2595$.\n$\\text{TVaR}_{0.95}=\\frac{665.14(0.2595)}{0.05}=3452$. (Compare $\\text{VaR}_{0.95}=2090$.)"},{"id":"h-17","m":6,"d":"h","l":"6.3","q":"$X_1$ and $X_2$ are independent exponentials, each with mean 100. Calculate $\\text{TVaR}_{0.9}$ of $S=X_1+X_2$.","c":["389.0","509.4","600.0","689.0"],"a":1,"s":"$S$ is gamma with $\\alpha=2$, $\\theta=100$, so $S(x)=(1+u)e^{-u}$ with $u=x/100$.\nVaR: solve $(1+u)e^{-u}=0.1$, giving $u=3.890$ and $\\text{VaR}_{0.9}=389.0$.\n$E[S;S>v]=\\alpha\\theta\\,P(\\text{Poisson}(u)\\le2)=200\\,e^{-u}\\left(1+u+\\tfrac{u^2}{2}\\right)=200(0.2547)$.\n$\\text{TVaR}_{0.9}=\\frac{200(0.2547)}{0.1}=509.4$."},{"id":"h-18","m":6,"d":"h","l":"6.2","q":"With probability 0.5, $X$ is exponential with mean 100; with probability 0.5, it is exponential with mean 1000. Calculate the 60th percentile $\\text{VaR}_{0.6}$.","c":["223.1","292.5","402.0","916.3"],"a":1,"s":"Solve $S(x)=0.4$ where $S(x)=0.5e^{-x/100}+0.5e^{-x/1000}$ (no closed form; solve numerically).\nAt $x=292.5$: $0.5e^{-2.925}=0.0268$ and $0.5e^{-0.2925}=0.3732$, summing to $0.4000$.\nSo $\\text{VaR}_{0.6}=292.5$. (916.3 is the answer if only the mean-1000 component were used.)"},{"id":"h-19","m":7,"d":"h","l":"7.2","q":"$N$ is negative binomial with $r=2$ and $\\beta=1$. $N^M$ is the zero-modified version with $P(N^M=0)=0.4$. Calculate $\\operatorname{Var}(N^M)$.","c":["2.56","3.20","3.84","4.00"],"a":2,"s":"$p_0=(1+\\beta)^{-r}=0.25$, so $c=\\frac{1-0.4}{1-0.25}=0.8$. Every moment of $N^M$ is $c$ times that of $N$.\n$E[N]=2$ and $E[N^2]=\\operatorname{Var}(N)+E[N]^2=4+4=8$.\n$E[N^M]=1.6$, $E[(N^M)^2]=6.4$, and $\\operatorname{Var}=6.4-1.6^2=3.84$."},{"id":"h-20","m":7,"d":"h","l":"7.3","q":"Annual claim counts are Poisson with mean $\\Lambda$, where $\\Lambda$ has a gamma prior with $\\alpha=3$ and $\\theta=0.5$. An insured has 4 claims in 3 years. Calculate the variance of the number of claims next year.","c":["1.40","1.68","2.00","2.34"],"a":1,"s":"Posterior: $\\alpha'=3+4=7$ and $\\frac1{\\theta'}=\\frac1{0.5}+3=5$, so $\\theta'=0.2$.\nNext year's count is negative binomial with $r=7$ and $\\beta=0.2$ (mean 1.4).\n$\\operatorname{Var}=r\\beta(1+\\beta)=7(0.2)(1.2)=1.68$."},{"id":"h-21","m":7,"d":"h","l":"7.4","q":"Last year, for 100 policies, the number of losses was negative binomial with $r=2$ and $\\beta=1.2$, and each loss had probability 0.8 of exceeding the deductible. Next year there are 150 similar independent policies, and a higher deductible makes the probability of exceeding it 0.6. Calculate the variance of next year's number of payments.","c":["2.16","3.15","3.72","4.32"],"a":2,"s":"Exposure $\\times1.5$ scales $r$: next year's losses are negative binomial with $r=3$ and $\\beta=1.2$.\nThinning by $v=0.6$ gives $\\beta'=0.6(1.2)=0.72$ (last year's 0.8 does not matter).\n$\\operatorname{Var}=3(0.72)(1.72)=3.7152$."},{"id":"h-22","m":8,"d":"h","l":"8.1","q":"Two independent compound Poisson portfolios: A has $\\lambda=30$ and exponential severity with mean 200. B has $\\lambda=10$ and Pareto severity with $\\alpha=3$ and $\\theta=1000$. Use the normal approximation to estimate the probability that total aggregate losses exceed 15,000.","c":["0.0668","0.1280","0.1587","0.2420"],"a":1,"s":"$E[S]=30(200)+10(500)=11{,}000$.\nPareto $E[X^2]=\\frac{2\\theta^2}{(\\alpha-1)(\\alpha-2)}=10^6$, so $\\operatorname{Var}(S)=30(2)(200^2)+10(10^6)=12{,}400{,}000$ and $\\sigma=3521$.\n$z=\\frac{4000}{3521}=1.136$ and $P=1-\\Phi(1.136)=0.1280$."},{"id":"h-23","m":8,"d":"h","l":"8.4","q":"$N$ is Poisson with mean 1.5. Severity is 1, 2 or 3 with probabilities 0.5, 0.3, 0.2. Calculate the aggregate stop-loss premium $E[(S-3)_+]$.","c":["0.5543","0.7172","0.9500","1.2000"],"a":1,"s":"Recursion $g_k=\\frac{1.5}{k}\\sum_jjf_jg_{k-j}$: $g_0=e^{-1.5}=0.2231$, $g_1=1.5(0.5)g_0=0.1673$, $g_2=0.75[0.5g_1+0.6g_0]=0.1632$.\n$E[S]=1.5(0.5+0.6+0.6)=2.55$.\n$E[S\\wedge3]=\\sum_{k=0}^{2}P(S>k)=3-(3g_0+2g_1+g_2)=3-1.1673=1.8327$.\n$E[(S-3)_+]=2.55-1.8327=0.7173$."},{"id":"h-24","m":8,"d":"h","l":"8.3","q":"The number of losses is Poisson with mean 40, and each loss is exponential with mean 500. Each loss has a per-loss deductible of 200 and a maximum covered loss of 1500. Use the normal approximation to estimate the probability that total payments exceed 15,000.","c":["0.0668","0.1587","0.2043","0.2420"],"a":2,"s":"Payment per loss $Z=(X\\wedge1500)-(X\\wedge200)$, which is at most 1300. $E[Z]=500\\left(e^{-0.4}-e^{-3}\\right)=310.27$.\n$E[Z^2]=\\int_0^{1300}2z\\,e^{-(200+z)/500}dz=e^{-0.4}(2)(500^2)\\left[1-e^{-2.6}(3.6)\\right]=245{,}543$.\n$E[S]=40(310.27)=12{,}411$ and $\\operatorname{Var}(S)=40(245{,}543)=9{,}821{,}720$, so $\\sigma=3134$.\n$z=\\frac{15000-12411}{3134}=0.826$ and $P=0.2043$."},{"id":"h-25","m":8,"d":"h","l":"8.6","q":"$X$ is exponential with mean 200. It is discretized by the method of rounding with span $h=100$ (so $R$ is $X$ rounded to the nearest multiple of 100). Calculate $E[R]$.","c":["175.0","197.9","200.0","204.2"],"a":1,"s":"$E[R]=100\\sum_{k\\ge1}P(R\\ge100k)=100\\sum_{k\\ge1}S(100k-50)=100\\sum_{k\\ge1}e^{-(100k-50)/200}$.\nThis is a geometric series: $100\\cdot\\frac{e^{-0.25}}{1-e^{-0.5}}=100\\cdot\\frac{0.7788}{0.3935}=197.9$. Rounding does not exactly preserve the mean (200)."},{"id":"h2-1","m":1,"d":"h","l":"1.2","q":"$X$ is single-parameter Pareto with $f(x)=\\frac{\\alpha\\theta^\\alpha}{x^{\\alpha+1}}$ for $x\\ge\\theta$. You are given $E[X]=6000$ and $E[X^2]=48{,}000{,}000$, and $m$ is the median of $X$. Calculate $f(m)$.","c":["0.000198","0.000250","0.000298","0.000350"],"a":2,"s":"$\\frac{E[X^2]}{E[X]^2}=\\frac{(\\alpha-1)^2}{\\alpha(\\alpha-2)}=\\frac{48}{36}=\\frac43$, which gives $\\alpha^2-2\\alpha-3=0$, so $\\alpha=3$.\n$\\theta=E[X]\\frac{\\alpha-1}{\\alpha}=4000$.\nThe median solves $\\left(\\frac\\theta m\\right)^3=0.5$, so $m=4000(2)^{1/3}=5039.7$.\n$f(m)=\\frac{3(4000^3)}{5039.7^4}=0.000298$."},{"id":"h2-2","m":1,"d":"h","l":"1.5","q":"A sample of five bivariate observations is $(x,y)$: $(2,6)$, $(3,2)$, $(5,4)$, $(7,9)$, $(8,5)$. Let $A$ be the covariance of the empirical distribution of these pairs, and $B$ the largest covariance possible for any joint distribution with the same two marginals. Calculate $B-A$.","c":["1.8","2.2","2.8","3.6"],"a":2,"s":"$\\bar x=5$, $\\bar y=5.2$. $E[XY]=\\frac{12+6+20+63+40}{5}=28.2$, so $A=28.2-26=2.2$.\nThe maximum covariance pairs the sorted values: $x$ with $2,4,5,6,9$. $E[XY]=\\frac{4+12+25+42+72}{5}=31$, so $B=31-26=5.0$.\n$B-A=2.8$."},{"id":"h2-3","m":1,"d":"h","l":"1.3","q":"A lab will receive a grant of 600,000 if at least one of its experiments succeeds. Each experiment costs 4,000 and independently succeeds with probability 0.03. Fixed costs are 100,000. How many experiments maximize expected profit?","c":["45","50","55","60"],"a":1,"s":"Expected profit with $n$ experiments: $600{,}000(1-0.97^n)-4000n-100{,}000$.\nGoing from $n$ to $n+1$ changes it by $600{,}000(0.03)(0.97^n)-4000=18{,}000(0.97^n)-4000$.\nThis is positive while $0.97^n>0.2222$, i.e. $n<49.4$. So profit rises through $n=50$ and falls after: the maximum is at $n=50$ (profit 169,161)."},{"id":"h2-4","m":1,"d":"h","l":"1.3","q":"Claim sizes from Alma are exponential with mean 5, and from Boaz exponential with mean 15, independent. Each submits one claim. Calculate the probability that the total of the two claims exceeds 25.","c":["0.0067","0.1889","0.2799","0.3679"],"a":2,"s":"For independent exponentials with means $\\theta_1<\\theta_2$: $P(X+Y>t)=\\frac{\\theta_2e^{-t/\\theta_2}-\\theta_1e^{-t/\\theta_1}}{\\theta_2-\\theta_1}$.\n$=\\frac{15e^{-1.6667}-5e^{-5}}{10}=\\frac{2.8332-0.0337}{10}=0.2799$."},{"id":"h2-5","m":2,"d":"h","l":"2.1","q":"In 2024, losses $X$ are Pareto with $\\alpha=3$ and unknown $\\theta$. Losses inflate uniformly at rate $r$, and the 65th percentile of 2025 losses equals the mean of 2024 losses. Calculate $r$, as a percentage.","c":["12.5","15.0","19.3","25.0"],"a":2,"s":"The 2024 mean is $\\frac\\theta2$. The 2025 losses are Pareto with $\\theta'=(1+r)\\theta$.\n$S\\left(\\frac\\theta2\\right)=0.35$: $\\left(\\frac{\\theta'}{\\theta'+\\theta/2}\\right)^3=0.35$, so $\\frac{\\theta'}{\\theta'+\\theta/2}=0.7047$.\n$\\theta'(1-0.7047)=0.7047\\cdot\\frac\\theta2$, so $\\theta'=1.1934\\theta$ and $r=19.3\\%$."},{"id":"h2-6","m":2,"d":"h","l":"2.1","q":"$X$ is exponential with mean 3 and $Y=X^{1.5}$. Calculate $\\operatorname{Var}(Y)$.","c":["47.7","114.3","162.0","209.7"],"a":1,"s":"$E[Y]=E[X^{1.5}]=\\theta^{1.5}\\Gamma(2.5)=5.196(1.3293)=6.907$.\n$E[Y^2]=E[X^3]=\\Gamma(4)\\theta^3=6(27)=162$.\n$\\operatorname{Var}(Y)=162-6.907^2=114.3$."},{"id":"h2-7","m":2,"d":"h","l":"2.2","q":"Losses are lognormal with median 400 and 90th percentile 1500. Calculate the mean loss.","c":["400.0","590.0","680.8","750.0"],"a":2,"s":"Median $=e^\\mu=400$, so $\\mu=5.9915$.\n90th percentile: $e^{\\mu+1.2816\\sigma}=1500$, so $\\sigma=\\frac{\\ln1500-\\ln400}{1.2816}=\\frac{1.3218}{1.2816}=1.0314$.\n$E[X]=e^{\\mu+\\sigma^2/2}=400e^{0.5319}=680.8$."},{"id":"h2-8","m":2,"d":"h","l":"2.2","q":"$X$ is gamma with $\\alpha=2$ and $\\theta=500$. Calculate $E[X\\,|\\,X>1000]$.","c":["1,500.0","1,666.7","1,800.0","2,000.0"],"a":1,"s":"With $u=\\frac{1000}{500}=2$: $S(1000)=P(\\text{Poisson}(2)\\le1)=e^{-2}(1+2)=0.4060$.\n$E[X;X>1000]=\\alpha\\theta\\,P(\\text{Poisson}(2)\\le2)=1000\\,e^{-2}(1+2+2)=1000(0.6767)$.\n$E[X|X>1000]=\\frac{676.7}{0.4060}=1666.7$."},{"id":"h2-9","m":3,"d":"h","l":"3.1","q":"$X$ and $Y$ are independent exponential random variables with $\\operatorname{Var}(X)=16$ and $\\operatorname{Var}(XY)=1200$. Calculate $\\operatorname{Var}(Y)$.","c":["10","25","50","100"],"a":1,"s":"With means $\\theta_X$, $\\theta_Y$: $\\operatorname{Var}(XY)=E[X^2]E[Y^2]-E[X]^2E[Y]^2=4\\theta_X^2\\theta_Y^2-\\theta_X^2\\theta_Y^2=3\\theta_X^2\\theta_Y^2$.\n$\\operatorname{Var}(X)=\\theta_X^2=16$, so $3(16)\\theta_Y^2=1200$ and $\\theta_Y^2=25=\\operatorname{Var}(Y)$."},{"id":"h2-10","m":3,"d":"h","l":"3.1","q":"Die $A$ is a fair 12-sided die (faces 1 to 12). Coin $B$ shows 2 or 10 with equal probability. What is the smallest number $n$ of tosses of $B$ such that the average of the $n$ tosses has a smaller variance than the average of 4 rolls of $A$?","c":["5","6","7","8"],"a":1,"s":"$\\operatorname{Var}(A)=\\frac{12^2-1}{12}=11.917$, so the average of 4 rolls has variance $2.979$.\n$\\operatorname{Var}(B)=(10-2)^2(0.5)(0.5)=16$, so the average of $n$ tosses has variance $\\frac{16}{n}$.\n$\\frac{16}{n}<2.979$ gives $n>5.37$, so $n=6$."},{"id":"h2-11","m":3,"d":"h","l":"3.2","q":"100 independent policies each pay 2000 with probability 0.05 and 0 otherwise. Use the normal approximation with continuity correction to estimate the probability that total payments exceed 12,000.","c":["0.1587","0.2456","0.3232","0.4207"],"a":1,"s":"$E[S]=100(0.05)(2000)=10{,}000$ and $\\operatorname{Var}(S)=100(2000^2)(0.05)(0.95)=19\\times10^6$, so $\\sigma=4359$.\n$S$ is a multiple of 2000, so $S>12{,}000$ means $S\\ge14{,}000$. The continuity boundary is the midpoint 13,000.\n$z=\\frac{3000}{4359}=0.688$ and $P=1-\\Phi(0.688)=0.2456$. (Without the correction, $z=0.459$ gives 0.3232.)"},{"id":"h2-12","m":4,"d":"h","l":"4.3","q":"A claim comes from one of three groups. Group 1 (60%): mean 10, variance 36. Group 2 (30%): mean 25, variance 100. Group 3 (10%): mean 50, variance 400. For 400 claims, use the normal approximation to find the 95th percentile of total claims in two cases: (a) each claim's group is random; (b) the group counts are fixed at 240, 120 and 40. Calculate (a) minus (b).","c":["120.0","160.0","202.0","250.0"],"a":2,"s":"The mean i
