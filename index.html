s the same in both cases: $E[S]=400(18.5)=7400$.\n(a) Mixture variance per claim: $E[X^2]=0.6(136)+0.3(725)+0.1(2900)=589.1$, so $\\operatorname{Var}=589.1-18.5^2=246.85$. Total $\\operatorname{Var}(S)=98{,}740$, so $\\sigma=314.2$.\n(b) Sum of known groups: $\\operatorname{Var}(S)=240(36)+120(100)+40(400)=36{,}640$, so $\\sigma=191.4$.\nDifference: $1.645(314.2-191.4)=202.0$. (Random group membership adds the variance of the group means.)"},{"id":"h2-13","m":4,"d":"h","l":"4.2","q":"Given $\\Lambda=\\lambda$, the hazard rate is $h(x|\\lambda)=\\lambda(1+x)$. $\\Lambda$ is gamma with $\\alpha=2$ and $\\theta=1$. Calculate the unconditional hazard rate at $x=2$.","c":["0.60","1.20","3.00","6.00"],"a":1,"s":"$H_0(x)=x+\\frac{x^2}{2}$, so $H_0(2)=4$, and the baseline hazard is $h_0(2)=3$.\n$S(x)=(1+\\theta H_0)^{-\\alpha}$, so $h(x)=\\frac{\\alpha\\theta h_0(x)}{1+\\theta H_0(x)}$.\n$h(2)=\\frac{2(1)(3)}{1+4}=1.20$."},{"id":"h2-14","m":4,"d":"h","l":"4.4","q":"A spliced distribution has weight 0.4 on a uniform distribution on $(0,100)$, and weight 0.6 on $100+Y$, where $Y$ is exponential with mean 200. Calculate $\\operatorname{Var}(X)$.","c":["30,000","39,333","40,000","79,333"],"a":1,"s":"$E[X]=0.4(50)+0.6(300)=200$.\nFirst piece: $E[X^2]=\\frac{100^2}{3}=3333.3$. Second piece: $E[(100+Y)^2]=100^2+2(100)(200)+2(200^2)=130{,}000$.\n$E[X^2]=0.4(3333.3)+0.6(130{,}000)=79{,}333$, so $\\operatorname{Var}=79{,}333-200^2=39{,}333$."},{"id":"h2-15","m":5,"d":"h","l":"5.1","q":"$X$ is single-parameter Pareto with $\\alpha=1$ and $\\theta=500$, so $S(x)=\\frac{500}{x}$ for $x\\ge500$. Calculate $E[X\\wedge2000]$.","c":["1,193.1","1,250.0","1,500.0","2,000.0"],"a":0,"s":"The table formula does not apply when $\\alpha=1$, so integrate the survival function from 0: $S(x)=1$ for $x<500$.\n$E[X\\wedge2000]=\\int_0^{500}1\\,dx+\\int_{500}^{2000}\\frac{500}{x}dx=500+500\\ln4=1193.1$."},{"id":"h2-16","m":5,"d":"h","l":"5.2","q":"Losses are Pareto with $\\alpha=4$ and $\\theta=2000$. A policy has an ordinary deductible of 1000. Calculate the variance of the payment per loss.","c":["39,017","197,530","553,574","592,593"],"a":2,"s":"Given $X>1000$, the payment is Pareto with $\\alpha=4$ and $\\theta'=3000$, and $S(1000)=\\left(\\frac23\\right)^4=0.1975$.\n$E[Y]=0.1975\\cdot\\frac{3000}{3}=197.5$.\n$E[Y^2]=0.1975\\cdot\\frac{2(3000^2)}{(3)(2)}=592{,}593$.\n$\\operatorname{Var}=592{,}593-197.5^2=553{,}574$."},{"id":"h2-17","m":5,"d":"h","l":"5.4","q":"For losses $X$, $E[X\\wedge x]$ is 250, 310, 360, 640, 700, 780 at $x=600$, 800, 1000, 2500, 3000, 4000. Losses will be inflated by 20%. The coverage then has an ordinary deductible of 1200 and a maximum covered loss of 3600. Calculate the expected payment per loss.","c":["340","408","450","500"],"a":1,"s":"Let $Y=1.2X$. Payment $=(Y\\wedge3600)-(Y\\wedge1200)$, and $E[Y\\wedge d]=1.2\\,E[X\\wedge d/1.2]$.\nSo $E=1.2\\left[E[X\\wedge3000]-E[X\\wedge1000]\\right]=1.2(700-360)=408$."},{"id":"h2-18","m":5,"d":"h","l":"5.3","q":"Losses are Pareto with $\\alpha=3$ and $\\theta=4000$. The coverage has an ordinary deductible of 600. What deductible doubles the loss elimination ratio?","c":["1,200","1,300","1,588.6","2,000"],"a":2,"s":"$\\text{LER}(600)=1-\\left(\\frac{4000}{4600}\\right)^2=0.2439$. Doubling gives $0.4877$.\n$\\left(\\frac{4000}{4000+d}\\right)^2=0.5123$, so $4000+d=\\frac{4000}{0.7157}=5588.6$ and $d=1588.6$."},{"id":"h2-19","m":5,"d":"h","l":"5.2","q":"Losses have $F(x)=1-0.5e^{-x/50}-0.5e^{-x/3000}$. A policy has an ordinary deductible of 200. Calculate the average payment per payment.","c":["1,525.0","2,943.4","3,000.0","3,050.0"],"a":1,"s":"$E[(X-200)_+]=0.5(50)e^{-4}+0.5(3000)e^{-200/3000}=0.46+1403.3=1403.8$.\n$S(200)=0.5e^{-4}+0.5e^{-0.0667}=0.0092+0.4677=0.4769$.\nPer payment: $\\frac{1403.8}{0.4769}=2943.4$. The long-tailed component dominates what is paid, not the simple average of means (1525)."},{"id":"h2-20","m":5,"d":"h","l":"5.3","q":"Losses have $F(x)=1-0.5e^{-x/50}-0.5e^{-x/3000}$ and next year they inflate by 25%. Calculate the loss elimination ratio for an ordinary deductible of 200 after inflation.","c":["0.0334","0.0668","0.1336","0.2000"],"a":1,"s":"Inflated losses are a 50-50 mixture of exponentials with means 62.5 and 3750.\n$E[Y\\wedge200]=0.5(62.5)(1-e^{-3.2})+0.5(3750)(1-e^{-0.0533})=29.98+97.34=127.3$.\n$E[Y]=0.5(62.5)+0.5(3750)=1906.25$, so $\\text{LER}=\\frac{127.3}{1906.25}=0.0668$."},{"id":"h2-21","m":6,"d":"h","l":"6.2","q":"$X$ is single-parameter Pareto, with $\\text{VaR}_p=\\theta(1-p)^{-1/\\alpha}$. You are given $\\text{VaR}_{0.9}=2512$ and $\\text{VaR}_{0.99}=6310$. Calculate $\\text{VaR}_{0.999}$.","c":["12,620","15,850","17,100","25,000"],"a":1,"s":"$\\frac{\\text{VaR}_{0.99}}{\\text{VaR}_{0.9}}=10^{1/\\alpha}=\\frac{6310}{2512}=2.512$.\nEach extra nine multiplies VaR by the same factor: $\\text{VaR}_{0.999}=6310(2.512)=15{,}850$. (Here $\\alpha=2.5$ and $\\theta=1000$.)"},{"id":"h2-22","m":6,"d":"h","l":"6.3","q":"With probability 0.5, $X$ is exponential with mean 100; with probability 0.5, it is exponential with mean 400. Calculate $\\text{TVaR}_{0.95}$.","c":["921.4","1,321.1","1,421.4","1,500.0"],"a":1,"s":"Solve $0.5e^{-v/100}+0.5e^{-v/400}=0.05$ numerically: $v=\\text{VaR}_{0.95}=921.4$.\nFor each exponential, $E[X;X>v]=S(v)(v+\\theta)$.\n$E[X;X>v]=0.5e^{-9.214}(1021.4)+0.5e^{-2.3036}(1321.4)=0.05+66.02=66.07$.\nDividing by $1-p=0.05$ gives $\\text{TVaR}_{0.95}=1321.1$."},{"id":"h2-23","m":7,"d":"h","l":"7.1","q":"$N$ is an $(a,b,0)$ distribution with $\\frac{p_2}{p_1}=2$ and $\\frac{p_3}{p_2}=\\frac{10}{9}$. Calculate $P(N=4)$.","c":["0.1160","0.1935","0.2903","0.3110"],"a":1,"s":"$a+\\frac b2=2$ and $a+\\frac b3=\\frac{10}{9}$, so $\\frac b6=\\frac89$, $b=\\frac{16}{3}$ and $a=-\\frac23$.\nNegative $a$ means binomial: $\\frac{q}{1-q}=\\frac23$ gives $q=0.4$, and $b=\\frac{(m+1)q}{1-q}=\\frac{16}3$ gives $m=7$.\n$P(N=4)=\\binom74(0.4)^4(0.6)^3=0.1935$."},{"id":"h2-24","m":7,"d":"h","l":"7.3","q":"Given $\\Lambda$, $N$ is Poisson with mean $\\Lambda$, and $\\Lambda$ is exponential with mean 6. Calculate $P(N\\ge5)$.","c":["0.2500","0.4627","0.5833","0.8571"],"a":1,"s":"An exponential is a gamma with $\\alpha=1$, so $N$ is negative binomial with $r=1$ and $\\beta=6$: a geometric.\n$P(N\\ge k)=\\left(\\frac{\\beta}{1+\\beta}\\right)^k$, so $P(N\\ge5)=\\left(\\frac67\\right)^5=0.4627$."},{"id":"h2-25","m":7,"d":"h","l":"7.3","q":"Given $\\Lambda$, $N$ is Poisson with mean $\\Lambda$. $\\Lambda$ is gamma with mean 4 and variance 8. Calculate $P(N\\le1)$.","c":["0.1111","0.2593","0.3333","0.4444"],"a":1,"s":"$\\alpha\\theta=4$ and $\\alpha\\theta^2=8$, so $\\theta=2$ and $\\alpha=2$. $N$ is negative binomial with $r=2$ and $\\beta=2$.\n$p_0=3^{-2}=0.1111$ and $p_1=\\frac{r\\beta}{(1+\\beta)^{r+1}}=\\frac{4}{27}=0.1481$.\n$P(N\\le1)=0.2593$."},{"id":"h2-26","m":7,"d":"h","l":"7.4","q":"Losses are Weibull with $\\tau=0.5$ and $\\theta=2000$. The number of nonzero payments under an ordinary deductible of 100 is negative binomial with $r=4$ and $\\beta=0.25$. The deductible is raised to 400. Calculate the probability of exactly one nonzero payment.","c":["0.2560","0.3215","0.3277","0.3600"],"a":1,"s":"$S(100)=e^{-\\sqrt{0.05}}=0.7997$ and $S(400)=e^{-\\sqrt{0.2}}=0.6394$.\nThe payment count keeps $r=4$, and $\\beta$ is scaled by $\\frac{S(400)}{S(100)}=0.7996$: $\\beta'=0.1999$.\n$P(N=1)=\\frac{r\\beta'}{(1+\\beta')^{r+1}}=\\frac{0.7996}{1.1999^5}=0.3215$."},{"id":"h2-27","m":7,"d":"h","l":"7.4","q":"Losses are uniform on $(0,2000)$. The number of losses above 500 is binomial with $m=12$ and $q=0.2$. Calculate the variance of the number of losses above 1000.","c":["1.1520","1.3867","1.9200","2.0000"],"a":1,"s":"$P(X>1000\\,|\\,X>500)=\\frac{1000}{1500}=\\frac23$, so the count above 1000 is binomial with $m=12$ and $q'=0.2\\cdot\\frac23=0.1333$.\n$\\operatorname{Var}=12(0.1333)(0.8667)=1.3867$."},{"id":"h2-28","m":8,"d":"h","l":"8.2","q":"Claim count is negative binomial with $r
