Q("1.1",r`The density of $X$ is $f(x)=\frac{3x^2}{1000}$ for $0<x<10$. Calculate $E[X]$.`,["5.00","6.67","7.00","7.50"],3,r`$E[X]=\int_0^{10}x\cdot\frac{3x^2}{1000}\,dx=\frac{3}{1000}\cdot\frac{10^4}{4}=7.5$.`),
Q("1.2",r`Loss $X$ has CDF $F(x)=1-\left(\frac{100}{100+x}\right)^2$ for $x>0$. Calculate the 70th percentile.`,["54.8","70.0","82.6","100.0"],2,r`Set $F(x)=0.7$, so $\left(\frac{100}{100+x}\right)^2=0.3$.
Then $100+x=100/\sqrt{0.3}=182.57$, so $x=82.6$.`),
Q("2.2",r`$X$ follows a Pareto distribution with $\alpha=3$ and $\theta=2000$. Calculate $\operatorname{Var}(X)$.`,[r`$1\times10^6$`,r`$3\times10^6$`,r`$4\times10^6$`,r`$6\times10^6$`],1,r`$E[X]=\frac{\theta}{\alpha-1}=1000$ and $E[X^2]=\frac{2\theta^2}{(\alpha-1)(\alpha-2)}=4\times10^6$.

Q("2.1",r`Losses $X$ are exponential with mean 500. Inflation of 5% turns each loss into $Y=1.05X$. Calculate $P(Y>600)$.`,["0.2837","0.3012","0.3189","0.3500"],2,r`$Y$ is exponential with $\theta=1.05(500)=525$ (scale family).

Q("3.2",r`A portfolio has 100 independent policies, each with mean loss 50 and standard deviation 20. Use the normal approximation to estimate $P(S>5300)$ for the total $S$.`,["0.0013","0.0228","0.0668","0.1587"],2,r`$E[S]=5000$, $\operatorname{Var}(S)=100(400)=40000$, so $\sigma_S=200$.

Q("3.3",r`A loss equals 1000 with probability 0.2 and 400 with probability 0.8. Calculate its variance.`,["28,800","57,600","90,000","360,000"],1,r`Bernoulli shortcut: $\operatorname{Var}=(a-b)^2pq=600^2(0.2)(0.8)=57{,}600$.`),
Q("4.1",r`With probability 0.6, $X$ is exponential with mean 100; with probability 0.4, it is exponential with mean 500. Calculate $\operatorname{Var}(X)$.`,["100,000","125,800","144,400","212,000"],2,r`$E[X]=0.6(100)+0.4(500)=260$.

Q("4.3",r`Given $\Theta$, $X$ has mean $\Theta$ and variance $2\Theta$. $\Theta$ has mean 10 and variance 3. Calculate $\operatorname{Var}(X)$.`,["13","20","23","26"],2,r`$\operatorname{Var}(X)=E[\operatorname{Var}(X|\Theta)]+\operatorname{Var}(E[X|\Theta])=E[2\Theta]+\operatorname{Var}(\Theta)=20+3=23$.`),
Q("5.1",r`$X$ is exponential with mean 1000. Calculate $E[X\wedge500]$.`,["367.9","393.5","500.0","606.5"],1,r`$E[X\wedge u]=\theta(1-e^{-u/\theta})=1000(1-e^{-0.5})=393.5$.`),
Q("5.2",r`Losses are exponential with mean 1000. A policy has an ordinary deductible of 500. Calculate the expected payment per loss.`,["393.5","500.0","606.5","1,000.0"],2,r`$E[(X-d)_+]=E[X]-E[X\wedge d]=1000-393.5=606.5$.

Q("5.3",r`Losses are Pareto with $\alpha=3$ and $\theta=2000$. Find the loss elimination ratio for an ordinary deductible of 1000.`,["0.3333","0.4444","0.5556","0.6667"],2,r`$E[X\wedge1000]=\frac{\theta}{\alpha-1}\left[1-\left(\frac{\theta}{\theta+d}\right)^{\alpha-1}\right]=1000\left(1-\frac49\right)=555.6$.
